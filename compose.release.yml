# release-deploy-bundle（core-01 部署方案 §2.1）：稳定版 release 形态 Compose。
# 引用 GHCR 预构建镜像，无需本地构建；由 .github/workflows/release.yml 打包为 deploy.zip 交付。
# 打包时镜像 tag 按 Release 名注入（ghcr.io/<owner>/coldrawdb:<tag>）。
services:
  coldrawdb:
    image: ghcr.io/<owner>/coldrawdb:<tag>
    # compose-backend-port-internal-only：不映射宿主机端口，
    # 后端仅经 compose 内部网络（coldrawdb:3000）供 nginx 反代；对外唯一入口为 nginx 9080。
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      COLDRAWDB_DB_URL: "sqlite:///data/coldrawdb.db?mode=rwc"
      COLDRAWDB_LOG_LEVEL: "info"
      # 邀请链接公开基址 = SPA 入口（nginx 宿主机端口），禁止默认裸后端 :3000。
      # 跨机部署时覆盖，如 PUBLIC_BASE_URL=http://192.168.20.106:9080
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:9080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/diagrams/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25
    ports:
      - "${COLDRAWDB_HTTP_PORT:-9080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      coldrawdb:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: alpine:3.19
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "
        apk add --no-cache sqlite tar &&
        while true; do
          tar czf /backups/coldrawdb-$$(date +%Y%m%d-%H%M%S).tar.gz -C /data .;
          sleep 86400;
        done
      "
    restart: unless-stopped
