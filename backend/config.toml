[database]
path = "db.sqlite"
init_sql_path = "init.sql"
test_path = "test.sqlite"

[server]
port = 3000
host = "127.0.0.1"

[options]
init_db = false

# [auth] access token 配置（issue #16，fix-remote-github-issues-7-18 批次 E）
# access_ttl_secs：access token 有效期（秒），缺省 3600（1 小时）；
#   合法区间 300～86400；可用环境变量 COLDRAWDB_ACCESS_TTL_SECS 覆盖本值；
#   非法值（非正整数 / 越界 / 无法解析）启动报错，不静默回退。
[auth]
access_ttl_secs = 3600
