[package]
name = "frontend-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
gloo = "0.11"
gloo-net = "0.5"
gloo-timers = { version = "0.2", features = ["futures"] }
leptos = "0.5"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "MouseEvent",
  "WheelEvent",
  "Window",
  "Element",
  "DomRect",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true