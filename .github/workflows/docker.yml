name: Docker Build and Push

# feat-docker-compose-deploy：PR/push 阶段新增 build-only 验证（防腐坏）；tag 仍走多架构推送。
on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:

concurrency:
  group: "docker-image"
  cancel-in-progress: false

jobs:
  # PR / 分支 push：仅验证镜像可构建，不推送
  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build only (no push)
      uses: docker/build-push-action@v5
      with:
        push: false
        tags: coldrawdb:ci-check

  # tag：多架构构建并推送 ghcr.io
  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        platforms: linux/amd64,linux/arm64
