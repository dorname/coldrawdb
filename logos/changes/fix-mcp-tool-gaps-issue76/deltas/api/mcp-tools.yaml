# Delta — mcp-tools.yaml（fix-mcp-tool-gaps-issue76）

> 模块：core | 场景：S06 | 关联 issue #76：大图删表无入口、areas/notes 只能全文档 PUT（撞 #70 客户端 ~64KB 截断）
> 约束延续：所有新增/修改的 inputSchema/outputSchema 顶层与结构内禁用 allOf/oneOf/anyOf/if/then/else/not（fix-mcp-tool-schema-client-compat 契约条款）；条件语义一律 description + 服务端强校验。

## MODIFIED — update_table（action 扩为 create|update|delete）

`title` 改为「创建、更新或删除表」。

`description` 末尾追加：

```yaml
      action=delete 按 table_id 删除整表：服务端顺带移除触碰该表的全部 references
      （start_table_id / end_table_id 命中，返回清理清单），维持无悬空；delete 禁止携带
      name/fields/comment/x/y/color/locked 任一字段，目标表不存在或携带禁字段均由
      服务端 tools/call 强校验并返回 VALIDATION_ERROR（零写入）。
```

`inputSchema` 修改：

```yaml
        action:
          type: string
          enum: [create, update, delete]
          default: update
          description: "create=追加整表（必填 name+fields，服务端重键并回传实际 ID 映射）；缺省 update；delete=按 table_id 删表并顺带清理触碰它的 references"
        table_id:
          type: string
          minLength: 1
          description: "create：调用方原始表 ID；update/delete：图中已存在的实际表 ID"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: "action=create 时必填；update 可选；delete 禁止携带"
        fields:
          type: array
          description: "仅 action=create 允许携带（必填），一次传入完整字段数组；action=update/delete 禁止携带，违者 VALIDATION_ERROR"
          items:
            $ref: "#/schemas/TableFieldInput"
```

（comment/x/y/color/locked 的 description 不变——delete 禁携带语义由工具 description 与服务端校验兜底。）

`outputSchema` properties 追加：

```yaml
        deleted_table_id:
          type: string
          minLength: 1
          description: "仅 action=delete 返回：被删除的表 ID"
        deleted_reference_ids:
          type: array
          description: "仅 action=delete 返回：因触碰被删表而顺带清理的关系 ID 清单"
          items:
            type: string
            minLength: 1
```

## ADDED — update_area 工具（插在 update_reference 之后、layout_diagram 之前）

```yaml
  - name: update_area
    title: 创建、更新或删除区域
    description: >-
      对 diagram.areas 的细粒度增量写（区域此前唯一写入口是 update_diagram 全文档 PUT，
      大图上受全文档体积约束）。通过 GET 全量读取 + PUT 全量写回实现，单次调用小载荷。
      action 缺省 update：按 area_id 修改携带的属性（未携带属性保持原值）。
      create 必填 name，服务端重键并回传实际 area_id，后续操作必须使用返回的实际 ID。
      delete 按 area_id 删除区域；delete 禁止携带 name/x/y/width/height/color/locked
      任一字段，目标区域不存在或携带禁字段均返回 VALIDATION_ERROR（零写入）。
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, area_id]
      properties:
        id:
          type: string
          minLength: 1
        action:
          type: string
          enum: [create, update, delete]
          default: update
          description: "create=追加区域（必填 name，服务端重键）；缺省 update；delete=按 area_id 删除"
        area_id:
          type: string
          minLength: 1
          description: "create：调用方原始区域 ID；update/delete：图中已存在的实际区域 ID"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: "action=create 时必填；update 可选；delete 禁止携带"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        color:
          type: string
          maxLength: 32
        locked:
          type: boolean
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        area_id:
          type: string
          minLength: 1
          description: "仅 action=create 返回：服务端实际区域 ID"
```

## ADDED — update_note 工具（紧随 update_area 之后）

```yaml
  - name: update_note
    title: 创建、更新或删除便签
