      对 diagram.notes 的细粒度增量写（便签此前唯一写入口是 update_diagram 全文档 PUT）。
      通过 GET 全量读取 + PUT 全量写回实现，单次调用小载荷。
      action 缺省 update：按 note_id 修改携带的属性（未携带属性保持原值）。
      create 必填 content，服务端重键并回传实际 note_id。
      delete 按 note_id 删除便签；delete 禁止携带 content/x/y/color 任一字段，
      目标便签不存在或携带禁字段均返回 VALIDATION_ERROR（零写入）。
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, note_id]
      properties:
        id:
          type: string
          minLength: 1
        action:
          type: string
          enum: [create, update, delete]
          default: update
          description: "create=追加便签（必填 content，服务端重键）；缺省 update；delete=按 note_id 删除"
        note_id:
          type: string
          minLength: 1
          description: "create：调用方原始便签 ID；update/delete：图中已存在的实际便签 ID"
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: "action=create 时必填；update 可选；delete 禁止携带"
        x:
          type: number
        y:
          type: number
        color:
          type: string
          maxLength: 32
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        note_id:
          type: string
          minLength: 1
          description: "仅 action=create 返回：服务端实际便签 ID"
```

## MODIFIED — update_diagram（防误删守护 + 分批指引扩展）

`description` 修改为：

```yaml
    description: >-
      使用 expected_revision 全量保存 diagram；409 时不自动覆盖。
      语义为「缺失 section = 删除」：desired 中缺失的表/字段/关系/区域/便签会被
      服务端删除（房间收编路径经 diff 生成对应 *。delete op；个人图直写为整文档覆盖）。
      单次参数体积软上限 256 KiB（COLDRAWDB_MCP_PAYLOAD_SOFT_LIMIT_BYTES 可调，
      fix-open-issues-26-33 / #26）：超限返回 PAYLOAD_TOO_LARGE 且不发送请求，
      details 给出当前体积与分片建议。大图（数十表/关系或含批量布局颜色变更）
      请分批写入：按表用 update_table（含 action=delete 删表）、按字段用 update_field、
      按关系用 update_reference、区域用 update_area、便签用 update_note、布局用
      layout_diagram，每批携带最新 expected_revision 严格串行（并行分批必然 409）。
      防误删守护（fix-mcp-tool-gaps-issue76）：写前与当前文档比较，desired 缺失表数
      > 10 或缺失比例 > 50%（其一即触发）时，必须显式携带 allow_mass_delete=true
      才执行，否则 VALIDATION_ERROR（details 含缺失计数与样例）零写入。
```

`inputSchema` properties 追加：

```yaml
        allow_mass_delete:
          type: boolean
          default: false
          description: "防误删守护确认：desired 缺失表数 > 10 或 > 50% 时必须为 true 才执行"
```

