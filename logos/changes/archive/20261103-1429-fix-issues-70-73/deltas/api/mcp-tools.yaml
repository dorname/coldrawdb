# Delta — mcp-tools.yaml（fix-issues-70-73）

> 模块：core | 场景：S06 | 关联 issue：#70、#71、#72
> 目标：在既有 12 个工具上补充整表/批量关系分片、端点一致性与房间凭据会话契约；不新增工具或 REST 端点。

