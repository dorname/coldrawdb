<!doctype html>
<html lang="zh-CN" data-mode="dark">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>coldrawdb · 一体化多人协作原型</title>
  <style>
    :root {

      --ease:cubic-bezier(.2,.8,.2,1);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    }
    html[data-mode="dark"] {
      --bg:#050f13;--bg-deep:#08191f;--surface:rgba(16,38,45,.86);--surface-solid:#10262d;
      --surface-soft:rgba(22,48,56,.78);--surface-hover:rgba(34,68,78,.96);--line:rgba(194,232,238,.16);
      --line-strong:rgba(194,232,238,.30);--text:#f2fdfe;--text-2:#b8d2d8;--text-3:#86a3ab;
      --brand:#5ee9dc;--brand-strong:#8cf0e6;--brand-soft:rgba(79,209,197,.18);--accent:#b9a0ff;
      --green:#5ee2aa;--amber:#f5c45c;--red:#ff8a8a;--blue:#7ab8f5;--shadow:0 24px 90px rgba(0,0,0,.45);

    .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:
      radial-gradient(circle at 16% 8%,color-mix(in srgb,var(--brand) 19%,transparent),transparent 31%),
      radial-gradient(circle at 84% 14%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 29%),
      linear-gradient(145deg,var(--bg),var(--bg-deep))}

    .icon--sm{width:15px;height:15px}.icon--lg{width:22px;height:22px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-soft);cursor:pointer;transition:.18s var(--ease);white-space:nowrap}

    html:not([data-mode="dark"]) .btn--primary{color:#fff}.btn--danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
    .btn--ghost{background:transparent;border-color:transparent}.btn--icon{width:38px;padding:0}.btn--sm{min-height:31px;padding:0 10px;font-size:12px}.btn.is-active{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 42%,transparent);color:var(--brand-strong)}
    .field{display:grid;gap:7px}.field label,.field-label{font-size:12px;font-weight:700;color:var(--text-2)}

    .error{min-height:16px;margin:0;color:var(--red);font-size:11px}.muted{color:var(--text-2)}.eyebrow{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .tag{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-soft);font-size:11px;font-weight:700;color:var(--text-2)}
    .tag--brand{background:var(--brand-soft);color:var(--brand-strong);border-color:color-mix(in srgb,var(--brand) 27%,transparent)}.tag--warn{color:var(--amber)}.tag--danger{color:var(--red)}

    /* 鉴权 */
    .auth{display:grid;grid-template-columns:minmax(360px,1.12fr) minmax(420px,.88fr);padding:18px;gap:18px}
    .auth-story{position:relative;overflow:hidden;border-radius:28px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;background:linear-gradient(155deg,color-mix(in srgb,var(--brand) 17%,var(--surface)),color-mix(in srgb,var(--accent) 12%,var(--surface)));border:1px solid var(--line);box-shadow:var(--shadow)}

    .hero-copy{position:relative;z-index:1;max-width:650px}.hero-copy h1{font-size:clamp(38px,5vw,74px);line-height:.98;letter-spacing:-.055em;margin:22px 0}.hero-copy h1 span{color:var(--brand)}
    .hero-copy p{max-width:570px;color:var(--text-2);font-size:17px;line-height:1.7}.feature-row{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .feature{padding:17px;border-radius:var(--r-md);background:color-mix(in srgb,var(--surface-solid) 40%,transparent);border:1px solid var(--line)}.feature .icon{color:var(--brand);margin-bottom:12px}.feature strong{display:block;font-size:13px}.feature span{display:block;margin-top:5px;color:var(--text-3);font-size:11px;line-height:1.5}
    .auth-panel{border-radius:28px;display:grid;place-items:center;padding:34px;min-height:0}.auth-card{width:min(430px,100%)}.auth-card h2{font-size:30px;letter-spacing:-.035em;margin:18px 0 7px}.auth-card>.muted{margin:0 0 26px;line-height:1.6}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line);margin-bottom:22px}.auth-tabs button{height:36px;border-radius:9px;background:transparent;color:var(--text-2);cursor:pointer}.auth-tabs button.is-active{background:var(--surface-solid);box-shadow:var(--shadow-soft);color:var(--text);font-weight:750}
    .auth-form{display:grid;gap:15px}.password-wrap{position:relative}.password-wrap .input{padding-right:44px}.password-toggle{position:absolute;right:5px;top:5px;width:35px;height:35px;display:grid;place-items:center;background:transparent;color:var(--text-2);border-radius:8px;cursor:pointer}
    .form-meta{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:12px}.checkbox{display:flex;gap:8px;align-items:center}.checkbox input{accent-color:var(--brand)}
    .auth-submit{width:100%;margin-top:4px}.demo-note{display:flex;gap:10px;margin-top:18px;padding:12px;border-radius:12px;background:var(--brand-soft);color:var(--text-2);font-size:11px;line-height:1.55}.demo-note .icon{flex:none;color:var(--brand)}
    .strength{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.strength span{height:3px;border-radius:9px;background:var(--line)}.strength[data-level="2"] span:nth-child(-n+2),.strength[data-level="3"] span:nth-child(-n+3),.strength[data-level="4"] span{background:var(--brand)}

    /* 房间列表 */
    .rooms{padding:18px;display:grid;grid-template-rows:64px 1fr;gap:16px}.rooms-nav{position:relative;z-index:20;border-radius:18px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.nav-actions{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:850;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;position:relative;border:2px solid color-mix(in srgb,var(--surface-solid) 70%,transparent)}
    .rooms-main{overflow:auto;padding:38px clamp(14px,5vw,72px) 60px}.rooms-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}.rooms-heading h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.05em;margin:8px 0}.rooms-heading p{color:var(--text-2);margin:0}.room-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .room-card{position:relative;overflow:hidden;min-height:215px;padding:22px;border-radius:20px;cursor:pointer;transition:.24s var(--ease);display:flex;flex-direction:column;justify-content:space-between}.room-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--brand) 32%,transparent);box-shadow:var(--shadow)}
    .room-card::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-70px;background:var(--room-accent,var(--brand));opacity:.13;filter:blur(2px)}.room-card h3{font-size:20px;margin:14px 0 5px}.room-card p{margin:0;color:var(--text-2);font-size:12px}.room-card-foot{display:flex;align-items:center;justify-content:space-between}.avatar-stack{display:flex}.avatar-stack .avatar{margin-left:-8px;width:30px;height:30px;border-radius:10px}.avatar-stack .avatar:first-child{margin-left:0}.room-meta{display:flex;gap:7px;align-items:center}
    .new-room-card{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:215px;background:color-mix(in srgb,var(--surface) 60%,transparent)}.new-room-card .brand-mark{margin-bottom:12px}.new-room-card h3{margin:0 0 6px}

    /* 编辑器框架 */
    .editor{display:grid;grid-template-rows:var(--appbar) 1fr var(--status);padding:10px;height:100%;gap:8px}.appbar{position:relative;border-radius:16px;display:flex;align-items:center;padding:0 10px 0 13px;gap:8px;z-index:40;min-width:0}.appbar .brand-mark{width:36px;height:36px;flex:none}.appbar-divider{width:1px;height:24px;background:var(--line);margin:0 3px}.diagram-title{min-width:80px;width:min(220px,18vw);height:38px;border:1px solid transparent;background:transparent;border-radius:10px;padding:0 10px;font-weight:750}.diagram-title:hover,.diagram-title:focus{background:var(--surface-soft);border-color:var(--line)}

    .presence{display:flex;align-items:center;padding-left:8px}.presence-person{position:relative;margin-left:-7px}.presence-person .avatar{width:31px;height:31px;border-radius:10px}.presence-dot{position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--surface-solid)}
    .appbar-actions{display:flex;gap:5px;align-items:center}.workspace{min-height:0;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--inspector);gap:8px;position:relative}.workspace.is-inspector-closed{grid-template-columns:var(--rail) minmax(0,1fr) 0}.workspace.is-code{grid-template-columns:var(--rail) minmax(0,1fr) 0}
    .toolrail{border-radius:16px;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:7px;z-index:25}.tool-button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:transparent;color:var(--text-2);cursor:pointer;position:relative;transition:.18s var(--ease)}.tool-button:hover:not(:disabled){color:var(--text);background:var(--surface-hover)}.tool-button.is-active{color:var(--brand);background:var(--brand-soft)}.tool-sep{height:1px;width:28px;background:var(--line);margin:3px 0}.tool-spacer{flex:1}.tool-tip{position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-4px);opacity:0;pointer-events:none;padding:7px 9px;background:var(--surface-solid);border:1px solid var(--line);box-shadow:var(--shadow-soft);border-radius:8px;color:var(--text);font-size:11px;white-space:nowrap;transition:.15s;z-index:50}.tool-button:hover .tool-tip{opacity:1;transform:translateY(-50%)}
    .canvas-shell{position:relative;min-width:0;min-height:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:color-mix(in srgb,var(--bg-deep) 60%,transparent);box-shadow:inset 0 0 70px color-mix(in srgb,var(--bg) 35%,transparent)}
    .canvas{position:absolute;inset:0;width:calc(100% / var(--zoom));height:calc(100% / var(--zoom));overflow:hidden;transform:scale(var(--zoom));transform-origin:0 0;background-image:radial-gradient(circle,color-mix(in srgb,var(--text-3) 30%,transparent) 1px,transparent 1.2px);background-size:24px 24px;cursor:default}
    .canvas::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 20%,color-mix(in srgb,var(--bg) 28%,transparent) 100%)}
    .canvas-top{position:absolute;top:13px;left:13px;right:13px;display:flex;align-items:flex-start;justify-content:space-between;z-index:8;pointer-events:none}.canvas-tools{display:flex;gap:6px;pointer-events:auto;padding:5px;border-radius:12px}.canvas-hint{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:11px;font-size:11px;color:var(--text-2)}
    .banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:12;max-width:min(720px,calc(100% - 40px));display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--amber) 14%,var(--surface-solid));border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);box-shadow:var(--shadow-soft);font-size:12px}.banner--danger{background:color-mix(in srgb,var(--red) 13%,var(--surface-solid));border-color:color-mix(in srgb,var(--red) 35%,transparent)}.banner .banner-actions{display:flex;gap:5px;margin-left:8px}
    .relation-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}.relation-path{fill:none;stroke:color-mix(in srgb,var(--brand) 72%,var(--text-2));stroke-width:2}.relation-path-bg{fill:none;stroke:color-mix(in srgb,var(--surface-solid) 70%,transparent);stroke-width:7}.relation-path.is-selected{stroke:var(--accent);stroke-width:2.6}.relation-path.is-preview{stroke:var(--accent);stroke-dasharray:6 5;stroke-width:2}
    .db-table{position:absolute;width:230px;border:1px solid var(--line-strong);border-radius:14px;background:color-mix(in srgb,var(--surface-solid) 84%,transparent);box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);z-index:3;overflow:hidden;transition:border-color .18s,box-shadow .18s}.db-table:hover{border-color:color-mix(in srgb,var(--brand) 36%,transparent)}.db-table.is-selected{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}.db-table.is-remote{animation:remote-pulse 1.1s var(--ease)}
    @keyframes remote-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}60%{box-shadow:0 0 0 12px transparent}100%{box-shadow:var(--shadow-soft)}}
    .table-head{height:43px;display:flex;align-items:center;gap:9px;padding:0 11px;border-bottom:1px solid var(--line);cursor:grab;background:linear-gradient(90deg,var(--table-color,var(--brand-soft)),transparent)}.table-head:active{cursor:grabbing}.table-symbol{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--table-color,var(--brand-soft));color:var(--brand-strong)}.table-head strong{flex:1;overflow:hidden;text-overflow:ellipsis}.table-count{font-size:10px;color:var(--text-3)}
    .table-field{min-height:35px;padding:0 11px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);font-size:11px;cursor:pointer}.table-field:last-child{border-bottom:0}.table-field:hover{background:var(--brand-soft)}.table-field.is-rel-source{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}.table-field.is-rel-target{background:color-mix(in srgb,var(--brand) 18%,transparent);box-shadow:inset 0 0 0 1px var(--brand)}.field-key{font-size:9px;font-weight:900;color:var(--amber)}.field-name{font-weight:650;overflow:hidden;text-overflow:ellipsis}.field-type{color:var(--text-3);font-family:ui-monospace,monospace;font-size:10px}
    .canvas-note,.canvas-area{position:absolute;z-index:2}.canvas-note{width:170px;min-height:95px;padding:14px;border-radius:6px 18px 18px 18px;background:color-mix(in srgb,var(--amber) 25%,var(--surface-solid));border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);box-shadow:var(--shadow-soft);color:var(--text-2);font-size:11px;line-height:1.55}.canvas-area{border:1px dashed color-mix(in srgb,var(--accent) 48%,transparent);border-radius:18px;background:color-mix(in srgb,var(--accent) 5%,transparent);color:var(--accent);padding:10px;font-size:11px;font-weight:750}
    .remote-cursor{position:absolute;z-index:7;pointer-events:none;color:var(--accent);transition:left .42s var(--ease),top .42s var(--ease);filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}.remote-cursor svg{width:24px;height:24px;fill:currentColor;stroke:white;stroke-width:1}.remote-label{position:absolute;left:17px;top:17px;padding:4px 7px;border-radius:2px 8px 8px 8px;background:var(--accent);color:white;font-size:9px;font-weight:800;white-space:nowrap}
    .inspector{border-radius:16px;overflow:hidden;min-width:0;display:flex;flex-direction:column;z-index:30;transition:.22s var(--ease)}.workspace.is-inspector-closed .inspector,.workspace.is-code .inspector{opacity:0;pointer-events:none;transform:translateX(12px)}.panel-head{height:52px;flex:none;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-head h2{font-size:13px;margin:0}.panel-body{padding:15px;overflow:auto;display:grid;align-content:start;gap:17px}.panel-section{display:grid;gap:10px}.panel-title{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:850;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase}.field-list{display:grid;gap:7px}.field-card{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft)}.field-card-main{min-width:0}.field-card strong{display:block;font-size:12px}.field-card small{color:var(--text-3)}
    .constraint-row{display:flex;flex-wrap:wrap;gap:6px}.constraint{padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:transparent;font-size:10px;color:var(--text-2);cursor:pointer}.constraint.is-on{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent);color:var(--brand)}

      diagram:clone(baseDiagram),selected:{type:"table",id:"users"},relationMode:false,relationSource:null,
      undo:[],redo:[],inspector:true,zoom:1,codeView:false,codeFormat:"sql",layer:null,drawer:null,
      importFormat:"sql",exportFormat:"sql",remoteCursor:{visible:true,x:680,y:330},remoteHighlight:null,
      activity:[
        {id:"a1",icon:"relation",text:"Alice 创建了 users → posts 关系",time:"刚刚"},
        {id:"a2",icon:"table",text:"你更新了 users.email",time:"2 分钟前"},
        {id:"a3",icon:"users",text:"Bob 加入了房间",time:"8 分钟前"}
      ],
      simulatorOpen:true,toasts:[],commandQuery:"",inviteRole:"editor",inviteExpired:false,diagnostics:null
    };

    const room = () => state.rooms.find(item => item.id === state.roomId) || state.rooms[0];
    const selectedTable = () => state.diagram.tables.find(item => state.selected?.type === "table" && item.id === state.selected.id);
    const canEdit = () => (state.role === "owner" || state.role === "editor") && (state.connection !== "failed" || state.localOnly);

    const canManage = () => state.role === "owner";
    const activity = (text, name = "activity") => state.activity.unshift({id:uid("activity"),icon:name,text,time:now()});

    function toast(title, message = "", type = "info") {
      const id = uid("toast"); state.toasts.push({id,title,message,type}); renderToasts();
      setTimeout(() => { state.toasts = state.toasts.filter(item => item.id !== id); renderToasts(); }, 3600);
    }
    function renderToasts() {
      $("#toast-region").innerHTML = state.toasts.map(item => `<section class="toast glass ${item.type === "error" ? "is-error" : ""}" data-toast-id="${item.id}"><span class="toast-icon">${icon(item.type === "error" ? "info" : "check","icon--sm")}</span><div><strong>${esc(item.title)}</strong>${item.message ? `<p>${esc(item.message)}</p>` : ""}</div><button data-action="dismiss-toast" data-id="${item.id}" aria-label="关闭通知">${icon("close","icon--sm")}</button></section>`).join("");
    }

    function render() {
      if (renderPending) return;
      renderPending = true;
      queueMicrotask(() => {
        renderPending = false;
        const nextView = state.view;
        document.documentElement.dataset.mode = state.theme;
        app.innerHTML = nextView === "auth" ? renderAuth() : nextView === "rooms" ? renderRooms() : nextView === "invite" ? renderInvitePage() : renderEditor();
        if (renderedView === nextView) app.firstElementChild?.classList.add("view--stable");
        renderedView = nextView;
        renderToasts();
        if (state.layer === "command") requestAnimationFrame(() => $("#command-input")?.focus());
      });
    }

    function renderAuth() {

      return `<section class="view auth" aria-labelledby="auth-title">
        <article class="auth-story">
          <div class="brand"><span class="brand-mark">${icon("logo","icon--lg")}</span><span>coldrawdb</span><span class="tag tag--brand">协作版原型</span></div>
          <div class="hero-copy"><span class="eyebrow">结构清晰，协作自然</span><h1>把复杂数据<br><span>画成共同语言。</span></h1><p>在一张实时同步的画布里完成数据库建模、关系评审和工程交接，让每个决定都有上下文。</p></div>
          <div class="feature-row">

            <form class="auth-form" id="auth-form" data-testid="${register ? "register-form" : "login-form"}" novalidate>
              ${register ? `<div class="field"><label for="display-name">显示名称</label><input class="input" id="display-name" name="name" value="林默" maxlength="32" autocomplete="name"><p class="error" data-error="name"></p></div>` : ""}
              <div class="field"><label for="auth-email">邮箱</label><input class="input" id="auth-email" name="email" type="email" value="lin@example.com" autocomplete="email" aria-describedby="email-error"><p class="error" id="email-error" data-error="email"></p></div>
              <div class="field"><label for="auth-password">密码</label><div class="password-wrap"><input class="input" id="auth-password" name="password" type="${state.passwordVisible ? "text" : "password"}" value="Pass1234" autocomplete="${register ? "new-password" : "current-password"}" aria-describedby="password-error"><button class="password-toggle" type="button" data-action="toggle-password" aria-label="${state.passwordVisible ? "隐藏密码" : "显示密码"}">${icon("eye")}</button></div><p class="error" id="password-error" data-error="password"></p>${register ? `<div class="strength" id="password-strength" data-level="3" aria-label="密码强度：良好"><span></span><span></span><span></span><span></span></div>` : ""}</div>
              ${register ? `<div class="field"><label for="auth-confirm">确认密码</label><input class="input" id="auth-confirm" name="confirm" type="password" value="Pass1234" autocomplete="new-password"><p class="error" data-error="confirm"></p></div>` : `<div class="form-meta"><label class="checkbox"><input type="checkbox" checked>记住此设备</label><button type="button" class="btn btn--ghost btn--sm" data-action="simulate-auth-error">模拟凭据错误</button></div>`}
              <div id="auth-alert" role="alert" class="error"></div>
              <button class="btn btn--primary auth-submit" type="submit" data-testid="${register ? "register-submit" : "login-submit"}" aria-busy="${state.loading}">${state.loading ? `<span class="spinner"></span>正在验证…` : `${register ? "创建账户" : "登录并进入空间"}${icon("arrow","icon--sm")}`}</button>

          </div>

      </section>`;
    }

    function renderRooms() {
      return `<section class="view rooms" data-testid="rooms-list-page">
        <header class="rooms-nav glass"><div class="brand"><span class="brand-mark">${icon("logo","icon--lg")}</span><span>coldrawdb</span><span class="tag tag--brand">工作空间</span></div><div class="nav-actions"><button class="btn btn--ghost btn--icon" data-action="theme" aria-label="切换主题">${icon("sun")}</button><button class="btn btn--primary" data-action="open-modal" data-modal="create-room" data-testid="btn-create-room">${icon("plus","icon--sm")}创建房间</button><button class="avatar" data-action="open-menu" data-menu="room-user" aria-label="用户菜单">林</button></div>${state.layer === "room-user" ? renderRoomUserMenu() : ""}</header>
        <div class="rooms-main"><div class="rooms-heading"><div><span class="eyebrow">下午好，${esc(state.user.name)}</span><h1 tabindex="-1">继续你的模型评审</h1><p>房间里的改动会实时同步给每一位成员。</p></div><span class="tag"><span class="dot" style="color:var(--green)"></span>协作服务正常 · 原型模拟</span></div>
        <div class="room-grid" data-testid="room-list">${state.rooms.map(item => `<article class="room-card glass" data-action="enter-room" data-room="${item.id}" style="--room-accent:${item.accent}" tabindex="0" role="button" aria-label="进入${esc(item.name)}"><div><div class="room-meta"><span class="tag tag--brand">${esc(item.role)}</span><span class="tag"><span class="dot" style="color:var(--green)"></span>${item.members} 人</span></div><h3>${esc(item.name)}</h3><p>${esc(item.diagram)}</p></div><div class="room-card-foot"><div class="avatar-stack"><span class="avatar">林</span><span class="avatar" style="background:#aa8cff">A</span><span class="avatar" style="background:#68aef2">B</span></div><span class="muted">${esc(item.updated)} ${icon("arrow","icon--sm")}</span></div></article>`).join("")}
          <button class="room-card new-room-card" data-action="open-modal" data-modal="create-room"><span class="brand-mark">${icon("plus","icon--lg")}</span><h3>新建协作房间</h3><p>绑定一个 diagram，邀请团队共同编辑</p></button></div></div>
        ${renderGlobalLayer()}
      </section>`;
    }

    function renderRoomUserMenu() {
      return `<div class="popover glass" role="menu"><button class="menu-item" data-action="diagnose">${icon("activity","icon--sm")}原型诊断</button><button class="menu-item" data-action="theme">${icon("sun","icon--sm")}切换主题</button><div class="menu-sep"></div><button class="menu-item" data-action="logout">${icon("back","icon--sm")}退出演示</button></div>`;
    }

    function renderInvitePage() {
      return `<section class="view auth" data-testid="invite-accept-page"><article class="auth-story"><div class="brand"><span class="brand-mark">${icon("logo","icon--lg")}</span><span>coldrawdb</span></div><div class="hero-copy"><span class="eyebrow">团队邀请</span><h1>${state.inviteExpired ? "这张邀请卡<br><span>已经失效。</span>" : "一起把模型<br><span>推向下一版。</span>"}</h1><p>${state.inviteExpired ? "邀请链接已超过 7 天，请联系房间 Owner 重新生成。" : "Alice 邀请你加入「评审周会」，共同编辑电商核心模型。"}</p></div><div></div></article><article class="auth-panel glass"><div class="auth-card"><span class="brand-mark">${icon(state.inviteExpired ? "info" : "users","icon--lg")}</span><h2 tabindex="-1">${state.inviteExpired ? "邀请已失效" : "加入评审周会"}</h2><p class="muted">${state.inviteExpired ? "为了保护房间安全，此邀请不再可用。" : `邀请人：Alice Chen · 分配角色：${esc(state.inviteRole)}`}</p><div class="option-card"><span class="avatar">A</span><div><strong>电商核心模型</strong><small>4 位成员 · server_rev 42 · 最近更新刚刚</small></div></div><div style="display:flex;gap:8px;margin-top:20px">${state.inviteExpired ? `<button class="btn" data-action="show-valid-invite">查看有效邀请演示</button>` : `<button class="btn btn--primary" data-action="accept-invite" data-testid="btn-accept-invite">${icon("check","icon--sm")}加入房间</button><button class="btn" data-action="expire-invite">模拟过期</button>`}<button class="btn btn--ghost" data-action="go-rooms">返回空间</button></div></div></article></section>`;
    }

    function renderEditor() {
      const currentRoom = room(); const saveText = {saved:"已保存",dirty:"有未保存更改",saving:"保存中…",error:"保存失败"}[state.diagram.saveState];
      const wsText = state.connection === "connected" ? "已连接 · OT 同步" : state.connection === "reconnecting" ? "重连中 · 操作排队" : state.connection === "syncing" ? "正在同步…" : state.localOnly ? "仅本地 · 409 风险" : "协作离线";
      const wsClass = state.connection === "connected" ? "" : state.connection === "reconnecting" || state.connection === "syncing" ? "is-warn" : "is-error";
      return `<section class="view editor" data-testid="room-editor-page">
        <header class="appbar glass" data-testid="app-bar"><div class="brand"><span class="brand-mark">${icon("logo","icon--lg")}</span></div><div class="appbar-divider"></div>
          <button class="btn btn--ghost btn--icon" data-action="undo" data-testid="btn-undo" ${!state.undo.length || !canEdit() ? "disabled" : ""} aria-label="撤销">${icon("undo")}</button><button class="btn btn--ghost btn--icon" data-action="redo" data-testid="btn-redo" ${!state.redo.length || !canEdit() ? "disabled" : ""} aria-label="重做">${icon("redo")}</button>
          <input class="diagram-title" data-testid="diagram-title" data-change="diagram-title" value="${esc(state.diagram.title)}" ${!canEdit() ? "disabled" : ""} aria-label="图表标题">
          <div class="appbar-divider"></div><button class="btn btn--ghost room-badge" data-action="go-rooms" data-testid="room-badge">${icon("users","icon--sm")}<strong>${esc(currentRoom.name)}</strong></button>
          <span class="tag save-chip" data-testid="save-state" data-state="${state.diagram.saveState}"><span class="dot"></span>${saveText}<span class="revision-text" data-testid="revision-display"> · rev ${state.diagram.revision}</span></span><div class="appbar-spacer"></div>
          <div class="presence" data-testid="room-presence">${state.members.filter(m => m.online).slice(0,4).map(m => `<span class="presence-person" title="${esc(m.name)} · ${m.role}"><span class="avatar" style="background:${m.color}">${esc(m.initial)}</span><span class="presence-dot" data-testid="presence-online"></span></span>`).join("")}</div>
          <div class="appbar-actions"><button class="btn btn--primary mobile-keep" data-action="open-modal" data-modal="invite" data-testid="btn-invite" ${!canInvite() ? "disabled" : ""}>${icon("plus","icon--sm")}邀请</button><button class="btn btn--ghost btn--icon mobile-keep" data-action="open-drawer" data-drawer="members" aria-label="成员">${icon("users")}</button><button class="btn btn--ghost btn--icon" data-action="toggle-code" data-testid="btn-code-view" aria-label="代码视图">${icon("code")}</button><button class="btn btn--ghost btn--icon mobile-keep" data-action="open-menu" data-menu="more" data-testid="btn-more-menu" aria-label="更多">${icon("more")}</button><button class="avatar" data-action="open-menu" data-menu="user" data-testid="user-menu" aria-label="用户菜单">林</button></div>
          ${state.layer === "more" ? renderMoreMenu() : state.layer === "user" ? renderUserMenu() : ""}
        </header>
        <div class="workspace ${!state.inspector ? "is-inspector-closed" : ""} ${state.codeView ? "is-code" : ""}">
          <nav class="toolrail glass" data-testid="tool-rail" aria-label="画布工具">
            <button class="tool-button" data-action="add-table" data-testid="tool-add-table" ${!canEdit() ? "disabled" : ""}>${icon("table","icon--lg")}<span class="tool-tip">新建表 <kbd>T</kbd></span></button>
            <button class="tool-button ${state.relationMode ? "is-active" : ""}" data-action="relation-mode" data-testid="tool-relationship" ${!canEdit() ? "disabled" : ""}>${icon("relation","icon--lg")}<span class="tool-tip">创建关系 <kbd>R</kbd></span></button>
            <button class="tool-button" data-action="add-area" ${!canEdit() ? "disabled" : ""}>${icon("area","icon--lg")}<span class="tool-tip">添加区域</span></button>
            <button class="tool-button" data-action="add-note" ${!canEdit() ? "disabled" : ""}>${icon("note","icon--lg")}<span class="tool-tip">添加便签</span></button><span class="tool-sep"></span>
            <button class="tool-button" data-action="open-command" data-testid="tool-search">${icon("search","icon--lg")}<span class="tool-tip">搜索与命令 <kbd>⌘K</kbd></span></button><span class="tool-spacer"></span>
            <button class="tool-button" data-action="open-drawer" data-drawer="activity">${icon("activity","icon--lg")}<span class="tool-tip">协作动态</span></button>
            <button class="tool-button" data-action="open-modal" data-modal="settings">${icon("settings","icon--lg")}<span class="tool-tip">画布设置</span></button>
          </nav>
          <main class="canvas-shell" data-testid="editor-canvas">${renderConnectionBanner()}${state.codeView ? renderCodeView() : renderCanvas()}${renderSimulator()}</main>
          ${renderInspector()}
          ${state.drawer ? renderDrawer() : ""}
        </div>
        <footer class="statusbar glass" data-testid="status-bar"><span class="status-group" data-testid="ws-status"><span class="dot ws-dot ${wsClass}"></span>${wsText}</span><span class="status-group" data-testid="ot-rev">server_rev ${state.serverRev}</span><span class="status-group desktop-only">${state.diagram.tables.length} 张表 · ${state.diagram.relations.length} 条关系</span>${state.pendingOps.length ? `<span class="tag tag--warn">${state.pendingOps.length} 项待同步</span>` : ""}<span class="status-spacer"></span><span class="tag tag--brand">${state.role}</span><button class="btn btn--ghost btn--sm" data-action="zoom-out" aria-label="缩小">−</button><span>${Math.round(state.zoom*100)}%</span><button class="btn btn--ghost btn--sm" data-action="zoom-in" aria-label="放大">＋</button><button class="btn btn--ghost btn--icon" data-action="toggle-inspector" data-testid="btn-inspector-toggle" aria-label="切换检查器">${icon("settings","icon--sm")}</button></footer>
        ${renderGlobalLayer()}
      </section>`;
    }

    function renderCanvas() {
      const relations = state.diagram.relations.map(rel => {
        const from = state.diagram.tables.find(t => t.id === rel.fromTable), to = state.diagram.tables.find(t => t.id === rel.toTable); if (!from || !to) return "";
        const x1=from.x+230,y1=from.y+63+(Math.max(0,from.fields.findIndex(f=>f.id===rel.fromField))*35),x2=to.x,y2=to.y+63+(Math.max(0,to.fields.findIndex(f=>f.id===rel.toField))*35); const c=Math.max(80,Math.abs(x2-x1)*.45); const d=`M${x1} ${y1} C${x1+c} ${y1},${x2-c} ${y2},${x2} ${y2}`;
        return `<path class="relation-path-bg" d="${d}" data-relation-bg="${rel.id}"/><path class="relation-path ${state.selected?.id===rel.id ? "is-selected" : ""}" d="${d}" data-relation="${rel.id}"/>`;
      }).join("");
      return `<div class="canvas" id="canvas" style="--zoom:${state.zoom};cursor:${state.relationMode?"crosshair":"default"}" tabindex="0"><svg class="relation-layer">${relations}<path class="relation-path is-preview" data-testid="rel-rubber-band" d="" hidden></path></svg>
        ${state.diagram.areas.map(area=>`<div class="canvas-area" style="left:${area.x}px;top:${area.y}px;width:${area.w}px;height:${area.h}px">${esc(area.name)}</div>`).join("")}
        ${state.diagram.tables.map(table => `<article class="db-table ${state.selected?.type==="table"&&state.selected.id===table.id?"is-selected":""} ${state.remoteHighlight===table.id?"is-remote":""}" data-testid="table-${table.id}" data-action="select-table" data-id="${table.id}" style="left:${table.x}px;top:${table.y}px;--table-color:${table.color}"><header class="table-head" data-drag-table="${table.id}"><span class="table-symbol">${icon("table","icon--sm")}</span><strong>${esc(table.name)}</strong><span class="table-count">${table.fields.length}</span></header>${table.fields.map(field=>`<div class="table-field ${state.relationSource?.field===field.id?"is-rel-source":""}" data-action="field-click" data-table="${table.id}" data-field="${field.id}"><span class="field-key">${field.pk?"PK":""}</span><span class="field-name">${esc(field.name)}</span><span class="field-type">${esc(field.type)}</span></div>`).join("")}</article>`).join("")}
        ${state.diagram.notes.map(note=>`<div class="canvas-note" style="left:${note.x}px;top:${note.y}px">${esc(note.text)}</div>`).join("")}
        ${state.remoteCursor.visible ? `<div class="remote-cursor" data-testid="remote-cursor" style="left:${state.remoteCursor.x}px;top:${state.remoteCursor.y}px"><svg viewBox="0 0 24 24"><path d="M3 2 19 12l-7 1-4 7z"/></svg><span class="remote-label">Alice</span></div>` : ""}
      </div><div class="canvas-top"><div class="canvas-tools glass"><button class="btn btn--ghost btn--sm" data-action="fit-canvas">适应画布</button><button class="btn btn--ghost btn--sm" data-action="center-selected">定位选中</button></div>${state.relationMode?`<div class="canvas-hint glass" data-testid="rel-tool-hint">${icon("relation","icon--sm")} ${state.relationSource?"选择目标字段，或从源字段拖出连线":"从字段拖出连线，或点击选择源字段"}<button class="btn btn--ghost btn--sm" data-action="relation-mode">取消</button></div>`:""}</div>`;
    }

    function renderInspector() {
      const table = selectedTable();
      return `<aside class="inspector glass" data-testid="inspector"><header class="panel-head"><h2>检查器</h2><button class="btn btn--ghost btn--icon" data-action="toggle-inspector" aria-label="关闭检查器">${icon("close","icon--sm")}</button></header><div class="panel-body">${table ? `<section class="panel-section"><div class="panel-title"><span>数据表</span><span class="tag">${esc(table.id)}</span></div><div class="field"><label for="table-name">名称</label><input id="table-name" class="input" data-change="table-name" data-id="${table.id}" value="${esc(table.name)}" ${!canEdit()?"disabled":""}></div><div class="field"><label for="table-color">强调色</label><select id="table-color" class="select" data-change="table-color" data-id="${table.id}" ${!canEdit()?"disabled":""}><option value="rgba(79,209,197,.18)">青绿色</option><option value="rgba(170,140,255,.17)">紫罗兰</option><option value="rgba(242,184,75,.18)">琥珀色</option></select></div></section><section class="panel-section"><div class="panel-title"><span>字段 · ${table.fields.length}</span><button class="btn btn--ghost btn--sm" data-action="add-field" data-id="${table.id}" ${!canEdit()?"disabled":""}>${icon("plus","icon--sm")}添加</button></div><div class="field-list">${table.fields.map(field=>`<article class="field-card"><div class="field-card-main"><input class="input" style="padding:6px 7px" data-change="field-name" data-table="${table.id}" data-field="${field.id}" value="${esc(field.name)}" ${!canEdit()?"disabled":""}><select class="select" style="padding:6px 7px;margin-top:5px" data-change="field-type" data-table="${table.id}" data-field="${field.id}" ${!canEdit()?"disabled":""}>${[field.type,"UUID","VARCHAR(255)","TEXT","INTEGER","BOOLEAN","TIMESTAMP"].filter((v,i,a)=>a.indexOf(v)===i).map(type=>`<option ${type===field.type?"selected":""}>${type}</option>`).join("")}</select><div class="constraint-row" style="margin-top:6px"><button class="constraint ${field.pk?"is-on":""}" data-action="toggle-constraint" data-key="pk" data-table="${table.id}" data-field="${field.id}" ${!canEdit()?"disabled":""}>PK</button><button class="constraint ${field.nn?"is-on":""}" data-action="toggle-constraint" data-key="nn" data-table="${table.id}" data-field="${field.id}" ${!canEdit()?"disabled":""}>NOT NULL</button><button class="constraint ${field.uq?"is-on":""}" data-action="toggle-constraint" data-key="uq" data-table="${table.id}" data-field="${field.id}" ${!canEdit()?"disabled":""}>UNIQUE</button></div></div><button class="btn btn--ghost btn--icon btn--danger" data-action="delete-field" data-table="${table.id}" data-field="${field.id}" ${!canEdit()?"disabled":""} aria-label="删除字段">${icon("trash","icon--sm")}</button></article>`).join("")}</div></section><button class="btn btn--danger" data-action="confirm-delete-table" data-id="${table.id}" ${!canEdit()?"disabled":""}>${icon("trash","icon--sm")}删除数据表</button>` : `<div class="empty-inspector"><span class="brand-mark">${icon("table","icon--lg")}</span><strong>选择一个对象</strong><p>在画布上选择表以编辑名称、字段与约束。</p></div>`}</div></aside>`;
    }

    function renderConnectionBanner() {

    function renderSimulator() {
      if (!state.simulatorOpen || state.codeView) return `<button class="btn btn--sm" style="position:absolute;right:14px;bottom:14px;z-index:15" data-action="toggle-simulator">${icon("bolt","icon--sm")}协作演示</button>`;

    }

    function renderCodeView() {
      return `<section class="code-view" data-testid="code-view-modal"><header class="code-toolbar"><div class="segmented"><button class="${state.codeFormat==="sql"?"is-active":""}" data-action="code-format" data-format="sql">SQL</button><button class="${state.codeFormat==="dbml"?"is-active":""}" data-action="code-format" data-format="dbml">DBML</button><button class="${state.codeFormat==="json"?"is-active":""}" data-action="code-format" data-format="json">JSON</button></div><span class="tag tag--brand">实时生成</span><span class="appbar-spacer"></span><button class="btn btn--sm" data-action="copy-code">${icon("copy","icon--sm")}复制</button><button class="btn btn--sm" data-action="toggle-code">${icon("close","icon--sm")}返回画布</button></header><textarea class="code-area" readonly aria-label="代码内容">${esc(exportContent(state.codeFormat))}</textarea></section>`;

    function renderDrawer() {
      if (state.drawer === "members") return `<aside class="drawer glass" data-testid="room-members-panel"><header class="panel-head"><div><h2>房间成员</h2><span class="muted" style="font-size:10px">${state.members.filter(m=>m.online).length} 人在线 · ${state.members.length} 位成员</span></div><button class="btn btn--ghost btn--icon" data-action="close-drawer" aria-label="关闭">${icon("close","icon--sm")}</button></header><div class="panel-body"><button class="btn btn--primary" data-action="open-modal" data-modal="invite" ${!canInvite()?"disabled":""}>${icon("plus","icon--sm")}邀请新成员</button><div class="member-list">${state.members.map(member=>`<article class="member-row"><span class="avatar" style="background:${member.color}">${esc(member.initial)}${member.online?`<span class="presence-dot"></span>`:""}</span><div><strong>${esc(member.name)} ${member.id==="me"?"（你）":""}</strong><small>${member.online?"在线":"最后在线 2 小时前"}</small></div>${member.id==="me"?`<span class="tag tag--brand">${member.role}</span>`:`<div style="display:flex;gap:4px"><select class="select" style="padding:6px;width:86px" data-change="member-role" data-id="${member.id}" ${!canManage()?"disabled":""}><option value="editor" ${member.role==="editor"?"selected":""}>editor</option><option value="viewer" ${member.role==="viewer"?"selected":""}>viewer</option></select><button class="btn btn--ghost btn--icon btn--danger" data-action="confirm-remove-member" data-id="${member.id}" ${!canManage()?"disabled":""} aria-label="移除成员">${icon("trash","icon--sm")}</button></div>`}</article>`).join("")}</div><div class="demo-note">${icon("info","icon--sm")}<span>Owner 可以修改角色与移除成员；Owner 自身需先转让房间才能离开。</span></div></div></aside>`;
      if (state.drawer === "activity") return `<aside class="drawer glass" data-testid="activity-feed"><header class="panel-head"><div><h2>协作动态</h2><span class="muted" style="font-size:10px">由本地与远端操作实时生成</span></div><button class="btn btn--ghost btn--icon" data-action="close-drawer" aria-label="关闭">${icon("close","icon--sm")}</button></header><div class="panel-body"><div class="activity-list">${state.activity.map(item=>`<article class="activity-item"><span class="activity-icon">${icon(item.icon||"activity","icon--sm")}</span><div><p>${esc(item.text)}</p><time>${esc(item.time)}</time></div></article>`).join("")}</div></div></aside>`;
      const isImport = state.drawer === "import", format = isImport ? state.importFormat : state.exportFormat;
      return `<aside class="drawer glass" data-testid="${isImport?"import-drawer":"export-drawer"}"><header class="panel-head"><div><h2>${isImport?"导入模型":"导出模型"}</h2><span class="muted" style="font-size:10px">SQL · DBML · JSON</span></div><button class="btn btn--ghost btn--icon" data-action="close-drawer" aria-label="关闭">${icon("close","icon--sm")}</button></header><div class="panel-body"><div class="drawer-tabs segmented" data-testid="${isImport?"import-format-tabs":"export-format-tabs"}">${["sql","dbml","json"].map(item=>`<button class="${format===item?"is-active":""}" data-action="drawer-format" data-format="${item}">${item.toUpperCase()}</button>`).join("")}</div>${isImport?`<div class="dropzone">${icon("upload","icon--lg")}<strong style="display:block;margin:8px 0 3px">拖入文件或粘贴内容</strong><span style="font-size:10px">单文件原型使用下方文本模拟导入</span></div><textarea class="textarea" id="import-source" data-testid="import-textarea" placeholder="CREATE TABLE products (id UUID PRIMARY KEY);">CREATE TABLE products (\n  id UUID PRIMARY KEY,\n  name VARCHAR(120) NOT NULL\n);</textarea><span class="tag" data-testid="import-parse-summary">检测到 1 个 CREATE TABLE</span><button class="btn btn--primary" data-action="import-submit" data-testid="import-submit">${icon("upload","icon--sm")}导入并打开</button>`:`<pre class="preview" data-testid="export-preview">${esc(exportContent(format))}</pre><div style="display:flex;gap:8px"><button class="btn" data-action="copy-export" data-testid="export-copy">${icon("copy","icon--sm")}复制</button><button class="btn btn--primary" data-action="download-export" data-testid="export-download">${icon("download","icon--sm")}下载 .${format}</button></div>`}</div></aside>`;
    }

    function renderGlobalLayer() {
      if (state.layer === "command") return renderCommand();
      if (!["create-room","invite","share","settings","confirm-table","confirm-member","diagnostics"].includes(state.layer)) return "";
      const close = `<button class="btn btn--ghost btn--icon" data-action="close-layer" aria-label="关闭">${icon("close")}</button>`;
      if (state.layer === "create-room") return `<div class="overlay" data-overlay><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-testid="modal-create-room"><header class="modal-head"><h2 id="modal-title">创建协作房间</h2>${close}</header><form id="create-room-form"><div class="modal-body"><div class="field"><label for="room-name">房间名称</label><input class="input" id="room-name" name="roomName" value="数据模型评审" maxlength="64"><p class="error" data-error="roomName"></p></div><div class="field"><label for="room-diagram">关联 diagram</label><select class="select" id="room-diagram"><option>电商核心模型</option><option>新建空白模型</option></select></div><div class="field"><label for="room-default-role">默认邀请角色</label><select class="select" id="room-default-role"><option value="editor">Editor · 可编辑</option><option value="viewer">Viewer · 只读</option></select></div></div><footer class="modal-foot"><button class="btn" type="button" data-action="close-layer">取消</button><button class="btn btn--primary" type="submit">创建并进入</button></footer></form></section></div>`;
      if (state.layer === "invite") return `<div class="overlay" data-overlay><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="invite-title" data-testid="modal-invite"><header class="modal-head"><h2 id="invite-title">邀请成员加入「${esc(room().name)}」</h2>${close}</header><div class="modal-body"><div class="field"><label for="invite-role">加入后的角色</label><select class="select" id="invite-role" data-change="invite-role"><option value="editor" ${state.inviteRole==="editor"?"selected":""}>Editor · 可以编辑</option><option value="viewer" ${state.inviteRole==="viewer"?"selected":""}>Viewer · 仅查看</option></select></div><div class="field"><span class="field-label">邀请链接 · 7 天内有效</span><div class="invite-link"><input class="input" data-testid="invite-url" readonly value="https://coldrawdb.local/invite/demo-${state.inviteRole}"><button class="btn" data-action="copy-invite">${icon("copy","icon--sm")}复制</button></div></div><div class="demo-note">${icon("info","icon--sm")}<span>原型不会写入剪贴板权限；复制行为以 Toast 模拟。</span></div></div><footer class="modal-foot"><button class="btn" data-action="preview-invite">打开邀请预览</button><button class="btn btn--primary" data-action="copy-invite">复制邀请</button></footer></section></div>`;
      if (state.layer === "share") return `<div class="overlay" data-overlay><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="share-title"><header class="modal-head"><h2 id="share-title">分享 diagram</h2>${close}</header><div class="modal-body"><div class="share-options"><label class="option-card"><input type="radio" name="share" checked><div><strong>房间成员可编辑</strong><small>按 Owner / Editor / Viewer 角色控制权限</small></div></label><label class="option-card"><input type="radio" name="share"><div><strong>持链接者只读</strong><small>匿名访问，不加入协作房间</small></div></label></div><div class="invite-link"><input class="input" readonly value="https://coldrawdb.local/editor/share/demo"><button class="btn" data-action="copy-share">${icon("copy","icon--sm")}复制</button></div></div><footer class="modal-foot"><button class="btn btn--primary" data-action="copy-share">复制分享链接</button></footer></section></div>`;
      if (state.layer === "settings") return `<div class="overlay" data-overlay><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="settings-title"><header class="modal-head"><h2 id="settings-title">偏好设置</h2>${close}</header><div class="modal-body"><div class="field"><label for="setting-theme">外观主题</label><select id="setting-theme" class="select" data-change="theme"><option value="dark" ${state.theme==="dark"?"selected":""}>深色玻璃</option><option value="light" ${state.theme==="light"?"selected":""}>浅色玻璃</option></select></div><label class="option-card"><input type="checkbox" checked><div><strong>显示画布网格</strong><small>24px 点阵辅助对象对齐</small></div></label><label class="option-card"><input type="checkbox" checked><div><strong>自动保存</strong><small>空闲 700ms 后生成新 revision</small></div></label></div><footer class="modal-foot"><button class="btn btn--primary" data-action="close-layer">完成</button></footer></section></div>`;
      if (state.layer === "confirm-table") return confirmModal("删除数据表？",`将同时删除「${esc(state.confirmName||"")}」的字段与相关关系。此操作可以通过撤销恢复。`,"delete-table");
      if (state.layer === "confirm-member") return confirmModal("移除房间成员？",`移除后，${esc(state.confirmName||"")} 将立即失去房间访问权限。`,"remove-member");
      const report = state.diagnostics || diagnose();
      return `<div class="overlay" data-overlay><section class="modal modal--wide glass" role="dialog" aria-modal="true" aria-labelledby="diag-title"><header class="modal-head"><h2 id="diag-title">原型诊断 · ${report.pass?"全部通过":"存在问题"}</h2>${close}</header><div class="modal-body"><div class="diagnostics">${report.checks.map(check=>`<div class="diagnostic ${check.pass?"pass":"fail"}">${icon(check.pass?"check":"info","icon--sm")}<span>${esc(check.name)}：${esc(check.detail)}</span></div>`).join("")}</div><pre class="preview">${esc(JSON.stringify(snapshot(),null,2))}</pre></div><footer class="modal-foot"><button class="btn" data-action="rerun-diagnostics">重新检查</button><button class="btn btn--primary" data-action="close-layer">完成</button></footer></section></div>`;
    }

    function confirmModal(title, text, action) { return `<div class="overlay" data-overlay><section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><header class="modal-head"><h2 id="confirm-title">${title}</h2><button class="btn btn--ghost btn--icon" data-action="close-layer" aria-label="关闭">${icon("close")}</button></header><div class="modal-body"><div class="demo-note" style="background:color-mix(in srgb,var(--red) 10%,transparent)">${icon("info","icon--sm")}<span>${text}</span></div></div><footer class="modal-foot"><button class="btn" data-action="close-layer">取消</button><button class="btn btn--danger" data-action="${action}">确认移除</button></footer></section></div>`; }

    function renderCommand() {
      const all = [{name:"新建数据表",icon:"table",action:"add-table",key:"T"},{name:"创建关系",icon:"relation",action:"relation-mode",key:"R"},{name:"导入模型",icon:"upload",action:"drawer-import"},{name:"导出模型",icon:"download",action:"drawer-export"},{name:"打开代码视图",icon:"code",action:"toggle-code",key:"⌘E"},{name:"邀请协作者",icon:"users",action:"modal-invite"},{name:"切换主题",icon:"sun",action:"theme"},{name:"运行原型诊断",icon:"activity",action:"diagnose"}];
      const items=all.filter(item=>item.name.includes(state.commandQuery));
      return `<div class="command" data-command-overlay><section class="command-box glass" role="dialog" aria-modal="true" aria-label="命令面板"><div class="command-search">${icon("search")}<input id="command-input" data-input="command" value="${esc(state.commandQuery)}" placeholder="搜索表、关系或命令…" autocomplete="off"><kbd>ESC</kbd></div><div class="command-results"><div class="command-group">快捷操作</div>${items.map((item,index)=>`<button class="command-item ${index===0?"is-active":""}" data-action="run-command" data-command="${item.action}">${icon(item.icon,"icon--sm")}<span>${item.name}</span>${item.key?`<kbd>${item.key}</kbd>`:""}</button>`).join("")||`<div class="empty-inspector">没有匹配的命令</div>`}<div class="command-group">数据表</div>${state.diagram.tables.filter(t=>t.name.includes(state.commandQuery)).map(t=>`<button class="command-item" data-action="command-select-table" data-id="${t.id}">${icon("table","icon--sm")}<span>${esc(t.name)}</span><kbd>${t.fields.length} 字段</kbd></button>`).join("")}</div></section></div>`;
    }

    function exportContent(format="sql") {
      if (format === "json") return JSON.stringify(state.diagram,null,2);
      if (format === "dbml") return state.diagram.tables.map(table=>`Table ${table.name} {\n${table.fields.map(field=>`  ${field.name} ${field.type.toLowerCase().replace(/\(.+\)/,"")}${field.pk?" [pk]":field.nn?" [not null]":""}`).join("\n")}\n}`).join("\n\n") + "\n\n" + state.diagram.relations.map(rel=>{const f=state.diagram.tables.find(t=>t.id===rel.fromTable),t=state.diagram.tables.find(x=>x.id===rel.toTable),ff=f?.fields.find(x=>x.id===rel.fromField),tf=t?.fields.find(x=>x.id===rel.toField);return `Ref: ${f?.name}.${ff?.name} < ${t?.name}.${tf?.name}`}).join("\n");
      return state.diagram.tables.map(table=>`CREATE TABLE ${table.name} (\n${table.fields.map((field,index)=>`  ${field.name} ${field.type}${field.pk?" PRIMARY KEY":""}${field.nn&&!field.pk?" NOT NULL":""}${field.uq&&!field.pk?" UNIQUE":""}${index<table.fields.length-1?",":""}`).join("\n")}\n);`).join("\n\n");
    }

    function commit(description, mutate, iconName="activity") {
      if (!canEdit()) { toast("当前为只读状态", state.role === "viewer" ? "Viewer 可以查看远端变化，但不能发送操作。" : "协作服务离线，请重连或选择仅本地编辑。", "error"); return false; }
      state.undo.push(clone(state.diagram)); if (state.undo.length > 50) state.undo.shift(); state.redo=[]; mutate(); activity(`你${description}`,iconName);
      if (state.connection === "reconnecting" || state.connection === "syncing") state.pendingOps.push({id:uid("op"),description}); else if (state.connection === "connected") state.serverRev++;
      markDirty(); render(); return true;
    }
    function renderSaveState() {
      const chip = $("[data-testid=save-state]");
      if (!chip) return;
      const text = {saved:"已保存",dirty:"有未保存更改",saving:"保存中…",error:"保存失败"}[state.diagram.saveState];
      chip.dataset.state = state.diagram.saveState;
      chip.innerHTML = `<span class="dot"></span>${text}<span class="revision-text" data-testid="revision-display"> · rev ${state.diagram.revision}</span>`;
    }
    function markDirty() {
      state.diagram.saveState="dirty";
      renderSaveState();
      clearTimeout(saveTimer);
      saveTimer=setTimeout(()=>{
        state.diagram.saveState="saving";
        renderSaveState();
        saveTimer=setTimeout(()=>{
          state.diagram.saveState="saved";
          state.diagram.revision++;
          renderSaveState();
        },430);
      },700);
    }
    function undo() { if (!state.undo.length || !canEdit()) return; state.redo.push(clone(state.diagram));state.diagram=state.undo.pop();state.diagram.saveState="dirty";activity("你撤销了上一步操作","undo");markDirty();render(); }
    function redo() { if (!state.redo.length || !canEdit()) return; state.undo.push(clone(state.diagram));state.diagram=state.redo.pop();state.diagram.saveState="dirty";activity("你重做了操作","redo");markDirty();render(); }

    function remoteCursor() { const positions=[[620,190],[790,310],[390,420],[680,330]],current=positions.findIndex(p=>p[0]===state.remoteCursor.x&&p[1]===state.remoteCursor.y);const next=positions[(current+1)%positions.length];state.remoteCursor={visible:true,x:next[0],y:next[1]};activity("Alice 正在查看画布","users");render(); }
    function disconnect() {state.connection="reconnecting";state.localOnly=false;toast("连接已断开","本地更改会安全排队，恢复后自动同步。","error");render();}
    function reconnect() {state.connection="syncing";render();setTimeout(()=>{const count=state.pendingOps.length;state.serverRev+=count+1;state.pendingOps=[];state.connection="connected";state.localOnly=false;activity(`协作连接已恢复，同步了 ${count} 项本地更改`,"wifi");toast("协作已恢复",`${count} 项排队操作已同步。`);render();},850);}

    function diagnose() {
      const ids=$$("[id]").map(node=>node.id),duplicates=ids.filter((id,index)=>ids.indexOf(id)!==index),required=["app","toast-region"],missing=required.filter(id=>!document.getElementById(id));
      const external=[...$$('link[rel="stylesheet"],script[src]')]; const remoteAttrs=$$("[src],[href]").filter(node=>/^(https?:)?\/\//.test(node.getAttribute("src")||node.getAttribute("href")||""));
      const checks=[
        {name:"单文件依赖",pass:external.length===0&&remoteAttrs.length===0,detail:external.length||remoteAttrs.length?"发现外部资源":"无外部 CSS、JS、字体或图片"},
        {name:"DOM 标识",pass:duplicates.length===0&&missing.length===0,detail:duplicates.length?`重复 ID：${duplicates.join(",")}`:"ID 唯一且根锚点存在"},
        {name:"角色权限",pass:["owner","editor","viewer"].includes(state.role),detail:`当前角色 ${state.role}`},
        {name:"协作 revision",pass:Number.isInteger(state.serverRev)&&state.serverRev>=0,detail:`server_rev ${state.serverRev}`},
        {name:"操作队列",pass:Array.isArray(state.pendingOps),detail:`${state.pendingOps.length} 项待同步`},
        {name:"数据模型",pass:state.diagram.tables.every(t=>t.id&&t.name&&Array.isArray(t.fields)),detail:`${state.diagram.tables.length} 张表、${state.diagram.relations.length} 条关系`},
        {name:"浮层状态",pass:state.layer===null||typeof state.layer==="string",detail:state.layer?`当前 ${state.layer}`:"无打开浮层"}
      ]; return {pass:checks.every(c=>c.pass),checks};
    }
    function snapshot(){return clone({view:state.view,role:state.role,connection:state.connection,serverRev:state.serverRev,pendingOps:state.pendingOps,tables:state.diagram.tables,relations:state.diagram.relations,openLayer:state.layer||state.drawer});}

      else if(action==="toggle-inspector"){state.inspector=!state.inspector;render();}

      else if(action==="remove-member"){const m=state.members.find(m=>m.id===state.confirmId);state.members=state.members.filter(x=>x.id!==state.confirmId);state.layer=null;activity(`你移除了成员 ${m?.name||""}`,"users");render();toast("成员已移除",`${m?.name||"该成员"} 已失去房间访问权限。`);}

      else if(action==="disconnect")disconnect(); else if(action==="reconnect")reconnect(); else if(action==="reconnect-fail"){state.connection="failed";state.localOnly=false;render();toast("重连失败","可以刷新或选择仅本地编辑。","error");}

      else if(action==="fit-canvas"){state.zoom=.9;render();}else if(action==="center-selected"){toast("已定位选中对象",selectedTable()?.name||"当前没有选中表");}

      else if(action==="run-command")runCommand(node.dataset.command); else if(action==="command-select-table"){state.selected={type:"table",id};state.layer=null;state.inspector=true;render();}

    }

    function handleFieldClick(tableId,fieldId){state.selected={type:"table",id:tableId};if(!state.relationMode){state.inspector=true;render();return;}if(!canEdit()){toast("Viewer 无法创建关系","你仍可查看现有关系。","error");return;}if(!state.relationSource){state.relationSource={table:tableId,field:fieldId};render();return;}if(state.relationSource.field===fieldId){toast("请选择不同字段","关系的两个端点不能相同。","error");return;}createRelation(state.relationSource.table,state.relationSource.field,tableId,fieldId);}
    function createRelation(fromTable,fromField,toTable,toField){if(fromField===toField&&fromTable===toTable){toast("请选择不同字段","关系的两个端点不能相同。","error");return;}state.relationMode=false;state.relationSource=null;commit("创建了一条字段关系",()=>state.diagram.relations.push({id:uid("rel"),fromTable,fromField,toTable,toField}),"relation");}
    function fieldPoint(table,fieldId,side){const idx=Math.max(0,table.fields.findIndex(f=>f.id===fieldId));return {x:side==="end"?table.x:table.x+230,y:table.y+63+idx*35};}
    function bezierD(x1,y1,x2,y2){const c=Math.max(80,Math.abs(x2-x1)*.45);return `M${x1} ${y1} C${x1+c} ${y1},${x2-c} ${y2},${x2} ${y2}`;}
    function relationD(rel){const from=state.diagram.tables.find(t=>t.id===rel.fromTable),to=state.diagram.tables.find(t=>t.id===rel.toTable);if(!from||!to)return "";const a=fieldPoint(from,rel.fromField,"start"),b=fieldPoint(to,rel.toField,"end");return bezierD(a.x,a.y,b.x,b.y);}
    function canvasPoint(event){const canvas=$("#canvas");if(!canvas)return {x:0,y:0};const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)/state.zoom,y:(event.clientY-rect.top)/state.zoom};}
    function paintRelations(){const layer=$(".relation-layer");if(!layer)return;state.diagram.relations.forEach(rel=>{const d=relationD(rel);layer.querySelector(`[data-relation="${rel.id}"]`)?.setAttribute("d",d);layer.querySelector(`[data-relation-bg="${rel.id}"]`)?.setAttribute("d",d);});const preview=layer.querySelector('[data-testid="rel-rubber-band"]');if(preview&&drag?.kind==="relation"&&drag.moved){const from=state.diagram.tables.find(t=>t.id===drag.tableId);if(from){const a=fieldPoint(from,drag.fieldId,"start");preview.setAttribute("d",bezierD(a.x,a.y,drag.x2,drag.y2));preview.removeAttribute("hidden");}}else if(preview)preview.setAttribute("hidden","");}
    function highlightRelTarget(tableId,fieldId){$$(".table-field.is-rel-target").forEach(el=>el.classList.remove("is-rel-target"));if(!tableId||!fieldId)return;const el=$(`.table-field[data-table="${tableId}"][data-field="${fieldId}"]`);if(el&&!(tableId===drag?.tableId&&fieldId===drag?.fieldId))el.classList.add("is-rel-target");}
    function schedulePaint(){if(paintRaf)return;paintRaf=requestAnimationFrame(()=>{paintRaf=0;if(drag?.kind==="table"){const node=$(`[data-testid="table-${drag.table.id}"]`);if(node){node.style.left=`${drag.table.x}px`;node.style.top=`${drag.table.y}px`;}paintRelations();}else if(drag?.kind==="relation"){paintRelations();highlightRelTarget(drag.hoverTable,drag.hoverField);}});}
    function runCommand(command){state.layer=null;if(command==="add-table")addTable();else if(command==="relation-mode"){state.relationMode=true;render();}else if(command==="drawer-import"){state.drawer="import";render();}else if(command==="drawer-export"){state.drawer="export";render();}else if(command==="toggle-code"){state.codeView=true;render();}else if(command==="modal-invite"){state.layer="invite";render();}else if(command==="theme"){state.theme=state.theme==="dark"?"light":"dark";render();}else if(command==="diagnose"){state.diagnostics=diagnose();state.layer="diagnostics";render();}}
    function importModel(){const source=$("#import-source")?.value||"";const names=[...source.matchAll(/CREATE\s+TABLE\s+["`']?([\w\u4e00-\u9fa5]+)/gi)].map(m=>m[1]);if(!names.length){toast("未检测到数据表","请输入包含 CREATE TABLE 的 SQL。","error");return;}const fresh=[...new Set(names)].filter(name=>!state.diagram.tables.some(t=>t.name===name));if(!fresh.length){toast("无需重复导入","检测到的数据表已全部存在。","error");return;}state.drawer=null;commit(`从 ${state.importFormat.toUpperCase()} 导入了 ${fresh.length} 张表`,()=>{fresh.forEach((name,index)=>{const id=name.replace(/[^a-zA-Z0-9_\u4e00-\u9fa5]/g,"_").toLowerCase()+"-"+(Date.now()+index).toString().slice(-4);state.diagram.tables.push({id,name,x:180+state.diagram.tables.length*55,y:145+state.diagram.tables.length*35,color:"rgba(79,209,197,.18)",fields:[{id:`${id}-id`,name:"id",type:"UUID",pk:true,nn:true,uq:true}]});state.selected={type:"table",id};});},"upload");toast("导入完成",`已从 ${state.importFormat.toUpperCase()} 创建 ${fresh.length} 张表。`);}
    function downloadExport(){const content=exportContent(state.exportFormat),blob=new Blob([content],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${state.diagram.title}.${state.exportFormat}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("已生成下载",a.download);}

    app.addEventListener("click", event => {
      const actionNode=event.target.closest("[data-action]");

      if(event.target.id==="create-room-form"){const data=new FormData(event.target),name=String(data.get("roomName")||"").trim();if(!name){$("[data-error=roomName]").textContent="请输入 1～64 字符的房间名称";return;}const id=uid("room");state.rooms.unshift({id,name,diagram:$("#room-diagram").value,role:"owner",members:1,accent:"#4fd1c5",updated:"刚刚"});state.roomId=id;state.role="owner";state.layer=null;state.view="editor";activity(`你创建了房间 ${name}`,"users");toast("房间已创建","现在可以邀请成员共同编辑。 ");render();}
    });

      else if(key==="role"){state.role=el.value;toast("演示角色已切换",el.value==="viewer"?"Viewer 只读，但仍接收远端操作。":`${el.value} 可以编辑画布。`);render();}
      else if(key==="member-role"){const m=state.members.find(m=>m.id===el.dataset.id);if(m&&canManage()){m.role=el.value;activity(`你将 ${m.name} 改为 ${m.role}`,"users");toast("成员角色已更新",`${m.name} 现在是 ${m.role}。`);render();}}

    app.addEventListener("input",event=>{if(event.target.dataset.input==="command"){state.commandQuery=event.target.value;const value=state.commandQuery;render();requestAnimationFrame(()=>{$("#command-input").value=value;$("#command-input").focus();});}});
    app.addEventListener("pointerdown",event=>{
      if(!canEdit())return;
      const fieldEl=event.target.closest("[data-action='field-click']");
      if(state.relationMode&&fieldEl){
        const pt=canvasPoint(event);
        drag={kind:"relation",tableId:fieldEl.dataset.table,fieldId:fieldEl.dataset.field,startX:event.clientX,startY:event.clientY,x2:pt.x,y2:pt.y,moved:false,hoverTable:null,hoverField:null};
        fieldEl.setPointerCapture?.(event.pointerId);
        return;
      }
      const head=event.target.closest("[data-drag-table]");
      if(!head)return;
      const table=state.diagram.tables.find(t=>t.id===head.dataset.dragTable);
      if(!table)return;
      drag={kind:"table",table,startX:event.clientX,startY:event.clientY,x:table.x,y:table.y,before:clone(state.diagram)};
      head.setPointerCapture?.(event.pointerId);
    });
    app.addEventListener("pointermove",event=>{
      if(!drag)return;
      if(drag.kind==="table"){
        drag.table.x=drag.x+(event.clientX-drag.startX)/state.zoom;
        drag.table.y=drag.y+(event.clientY-drag.startY)/state.zoom;
        schedulePaint();
        return;
      }
      const dist=Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY);
      if(dist>=DRAG_THRESHOLD)drag.moved=true;
      const pt=canvasPoint(event);
      drag.x2=pt.x;drag.y2=pt.y;
      const hover=document.elementFromPoint(event.clientX,event.clientY)?.closest("[data-action='field-click']");
      drag.hoverTable=hover?.dataset.table||null;
      drag.hoverField=hover?.dataset.field||null;
      if(drag.moved)schedulePaint();
    });
    app.addEventListener("pointerup",event=>{
      if(!drag)return;
      if(drag.kind==="table"){
        drag.table.x=Math.round(drag.table.x/GRID)*GRID;
        drag.table.y=Math.round(drag.table.y/GRID)*GRID;
        if(drag.table.x!==drag.x||drag.table.y!==drag.y){state.undo.push(drag.before);state.redo=[];activity(`你移动了表 ${drag.table.name}`,"table");if(state.connection==="reconnecting")state.pendingOps.push({id:uid("op"),description:"移动表"});else state.serverRev++;markDirty();}
        drag=null;render();
        return;
      }
      const rel=drag;
      drag=null;
      highlightRelTarget(null,null);
      const preview=$('[data-testid="rel-rubber-band"]');
      if(preview)preview.setAttribute("hidden","");
      if(!rel.moved)return;
      skipFieldClick=true;
      const target=document.elementFromPoint(event.clientX,event.clientY)?.closest("[data-action='field-click']");
      if(target&&!(target.dataset.table===rel.tableId&&target.dataset.field===rel.fieldId))createRelation(rel.tableId,rel.fieldId,target.dataset.table,target.dataset.field);
      else {state.relationSource={table:rel.tableId,field:rel.fieldId};render();}
    });
    document.addEventListener("keydown",event=>{const mod=event.ctrlKey||event.metaKey;if(event.key==="Escape"&&(state.layer||state.drawer||state.relationMode)){state.layer=null;state.drawer=null;if(state.relationMode){state.relationMode=false;state.relationSource=null;drag=null;}render();}else if(mod&&event.key.toLowerCase()==="k"){event.preventDefault();state.layer="command";state.commandQuery="";render();}else if(mod&&event.key.toLowerCase()==="z"){event.preventDefault();event.shiftKey?redo():undo();}else if(mod&&event.key.toLowerCase()==="y"){event.preventDefault();redo();}else if(mod&&event.key.toLowerCase()==="s"){event.preventDefault();clearTimeout(saveTimer);state.diagram.saveState="saving";renderSaveState();saveTimer=setTimeout(()=>{state.diagram.saveState="saved";state.diagram.revision++;toast("已立即保存",`revision ${state.diagram.revision}`);renderSaveState()},350);}});

    window.__cdbPrototype = Object.freeze({diagnose,snapshot,demo(action){const map={"remote-cursor":remoteCursor,"remote-table":remoteTable,"disconnect":disconnect,"reconnect":reconnect,"reconnect-fail":()=>{state.connection="failed";render()},viewer:()=>{state.role="viewer";render()}};if(!map[action])throw new Error("不支持的演示动作");map[action]();return snapshot();}});
    render();
  })();
  </script>
</body>
</html>
