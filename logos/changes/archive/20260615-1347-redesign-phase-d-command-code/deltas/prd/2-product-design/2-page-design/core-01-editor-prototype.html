<!--
  Delta — core-01-editor-prototype.html (Phase D)
  merge 操作：
  1. ADDED：AppBar btn-code-view；View 菜单项占位注释
  2. ADDED：Command Palette 浮层样式与示例节点
  3. ADDED：Code View 全屏模式样式块（.cdb-is-code-view）
  4. 保留 Phase C IO Drawer 示例（默认隐藏，注释切换）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>coldrawdb Editor Prototype — Phase D Palette + Code View</title>
  <style>
    :root {
      --cdb-color-primary: #175e7a;
      --cdb-color-primary-bg: #e6f1f5;
      --cdb-color-border: #e5e7eb;
      --cdb-color-bg: #fff;
      --cdb-color-bg-canvas: #f3f4f6;
      --cdb-color-text: #1f2937;
      --cdb-color-text-muted: #6b7280;
      --cdb-space-2: 8px;
      --cdb-space-3: 12px;
      --cdb-space-4: 16px;
      --cdb-radius-sm: 4px;
      --cdb-radius-md: 8px;
      --cdb-text-sm: 13px;
      --cdb-text-xs: 11px;
      --cdb-shadow-md: 0 4px 12px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; color: var(--cdb-color-text); }
    .cdb-app { display: grid; grid-template-rows: 48px 1fr 28px; height: 100vh; position: relative; }
    .cdb-app-bar {
      display: flex; align-items: center; gap: var(--cdb-space-3);
      padding: 0 var(--cdb-space-4); border-bottom: 1px solid var(--cdb-color-border);
    }
    .cdb-btn {
      padding: 6px 12px; border: 1px solid var(--cdb-color-border);
      border-radius: var(--cdb-radius-sm); background: var(--cdb-color-bg);
      font-size: var(--cdb-text-sm); cursor: pointer;
    }
    .cdb-btn--primary { background: var(--cdb-color-primary); color: #fff; border-color: var(--cdb-color-primary); }
    .cdb-btn--active { background: var(--cdb-color-primary-bg); border-color: var(--cdb-color-primary); color: var(--cdb-color-primary); }
    .cdb-main {
      display: grid;
      grid-template-columns: 48px 1fr 320px 0;
      min-height: 0;
    }
    .cdb-main.cdb-is-code-view {
      grid-template-columns: 1fr;
    }
    .cdb-main.cdb-is-code-view .cdb-tool-rail,
    .cdb-main.cdb-is-code-view .cdb-canvas-wrap,
    .cdb-main.cdb-is-code-view .cdb-inspector,
    .cdb-main.cdb-is-code-view .cdb-io-drawer { display: none; }
    .cdb-tool-rail {
      width: 48px; border-right: 1px solid var(--cdb-color-border);
      display: flex; flex-direction: column; align-items: center; padding: var(--cdb-space-2) 0; gap: var(--cdb-space-2);
    }
    .cdb-canvas-wrap { background: var(--cdb-color-bg-canvas); position: relative; overflow: hidden; }
    .cdb-inspector {
      border-left: 1px solid var(--cdb-color-border); padding: var(--cdb-space-4);
      font-size: var(--cdb-text-sm);
    }
    /* Phase D — Code View */
    .cdb-code-view {
      display: none; flex-direction: column; min-height: 0; background: var(--cdb-color-bg);
    }
    .cdb-main.cdb-is-code-view .cdb-code-view { display: flex; }
    .cdb-code-view__toolbar {
      display: flex; align-items: center; gap: var(--cdb-space-3);
      padding: var(--cdb-space-3) var(--cdb-space-4);
      border-bottom: 1px solid var(--cdb-color-border);
    }
    .cdb-code-view__textarea {
      flex: 1; margin: var(--cdb-space-4); padding: var(--cdb-space-4);
      border: 1px solid var(--cdb-color-border); border-radius: var(--cdb-radius-sm);
      font-family: ui-monospace, monospace; font-size: var(--cdb-text-xs);
      resize: none;
    }
    /* Phase D — Command Palette */
    .cdb-palette-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 15vh; z-index: 450;
    }
    .cdb-command-palette {
      width: 560px; max-height: 60vh; background: var(--cdb-color-bg);
      border-radius: var(--cdb-radius-md); box-shadow: var(--cdb-shadow-md);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .cdb-command-palette__input {
      width: 100%; padding: var(--cdb-space-4);
      border: none; border-bottom: 1px solid var(--cdb-color-border);
      font-size: var(--cdb-text-sm); outline: none;
    }
    .cdb-command-palette__results {
      overflow-y: auto; padding: var(--cdb-space-2) 0;
      font-size: var(--cdb-text-sm);
    }
    .cdb-command-palette__group {
      padding: var(--cdb-space-2) var(--cdb-space-4);
      font-size: var(--cdb-text-xs); color: var(--cdb-color-text-muted); font-weight: 600;
    }
    .cdb-command-palette__item {
      padding: var(--cdb-space-2) var(--cdb-space-4);
      display: flex; justify-content: space-between; cursor: pointer;
    }
    .cdb-command-palette__item:hover,
    .cdb-command-palette__item.cdb-is-highlighted {
      background: var(--cdb-color-primary-bg);
    }
    .cdb-status-bar {
      border-top: 1px solid var(--cdb-color-border); padding: 0 var(--cdb-space-4);
      height: 28px; display: flex; align-items: center; gap: var(--cdb-space-4);
      font-size: var(--cdb-text-xs); color: var(--cdb-color-text-muted);
    }
  </style>
</head>
<body>
  <!-- 示例 A：Canvas + Command Palette 打开 -->
  <div class="cdb-app">
    <header class="cdb-app-bar" data-testid="app-bar">
      <strong>C</strong>
      <span data-testid="diagram-title">电商 ER 图</span>
      <span>● 已保存</span>
      <button class="cdb-btn" data-testid="btn-import">导入</button>
      <button class="cdb-btn" data-testid="btn-export">导出 ▾</button>
      <button class="cdb-btn" data-testid="btn-code-view">代码</button>
      <button class="cdb-btn cdb-btn--primary" data-testid="btn-share">分享</button>
    </header>

    <div class="cdb-main">
      <nav class="cdb-tool-rail" data-testid="tool-rail"><button>↖</button><button>⊕</button></nav>
      <main class="cdb-canvas-wrap" data-testid="editor-canvas">
        <p style="padding:24px;color:var(--cdb-color-text-muted);">画布（Ctrl+K 打开命令面板）</p>
      </main>
      <aside class="cdb-inspector" data-testid="inspector-panel"><h3>users</h3></aside>
      <section class="cdb-code-view" data-testid="code-view">
        <div class="cdb-code-view__toolbar">
          <button class="cdb-btn cdb-btn--active" data-testid="code-format-sql">SQL</button>
          <button class="cdb-btn" data-testid="code-format-dbml">DBML</button>
          <select data-testid="code-engine-select"><option>generic</option></select>
          <span style="flex:1"></span>
          <button class="cdb-btn" data-testid="code-copy-btn">复制</button>
          <button class="cdb-btn" data-testid="code-back-btn">返回画布</button>
        </div>
        <textarea class="cdb-code-view__textarea" data-testid="code-view-textarea" readonly>CREATE TABLE users (
  id INT PRIMARY KEY
);</textarea>
      </section>
    </div>

    <footer class="cdb-status-bar" data-testid="status-bar">
      <span>缩放 100%</span><span>1 张表</span><span data-testid="revision-display">rev: 1</span>
    </footer>

    <!-- Phase D: Command Palette -->
    <div class="cdb-palette-backdrop" data-testid="command-palette-backdrop">
      <div class="cdb-command-palette" data-testid="command-palette">
        <input class="cdb-command-palette__input" data-testid="command-palette-input"
               placeholder="搜索表、区域、命令…" value="user" />
        <div class="cdb-command-palette__results" data-testid="command-palette-results">
          <div class="cdb-command-palette__group">表</div>
          <div class="cdb-command-palette__item cdb-is-highlighted" data-testid="command-palette-item-table-users">
            <span>users</span><span style="color:var(--cdb-color-text-muted)">3 fields</span>
          </div>
          <div class="cdb-command-palette__group">操作</div>
          <div class="cdb-command-palette__item" data-testid="command-palette-item-action-create-table">+ 创建新表</div>
          <div class="cdb-command-palette__item" data-testid="command-palette-item-action-open-import">↑ 打开导入抽屉</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
