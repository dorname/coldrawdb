          example: 3600
```

## MODIFIED — RefreshResponse.expiresIn 示例

```yaml
        expiresIn:
          type: integer
          example: 3600
```

## ADDED — 契约说明（TTL 配置化不变量）

- `/auth/login` 与 `/auth/refresh` 返回的 `expiresIn` **必须等于**实际签发 JWT 的 `exp - iat`，且等于生效的 `access_ttl_secs` 配置值。
- `access_ttl_secs` 合法区间 300～86400；配置缺省为 3600；非法值（非正整数 / 超界）启动报错，不静默回退。
- refresh token TTL 口径不变（remember_device=true 30 天 / false 7 天），不在本提案调整。
