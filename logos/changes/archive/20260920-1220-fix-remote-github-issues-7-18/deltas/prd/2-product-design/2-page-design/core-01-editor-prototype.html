<!-- 操作 1 MODIFIED 片段：连线自动选侧（替换原 bezierD / relationD） -->
<script>
// 出入侧选择纯函数：目标表中心在源表中心左侧 → 左出右进；否则 → 右出左进
function pickPortSides(from, to){
  const fc = from.x + tableWidth(from)/2, tc = to.x + tableWidth(to)/2;
  return tc < fc ? { out: "left", into: "right" } : { out: "right", into: "left" };
}
// side 感知锚点：out/into ∈ left|right，取字段行对应侧缘中点
function fieldPointSide(table, fieldId, side){ /* 按 side 取 table.x 或 table.x+width，y 不变 */ }
// 贝塞尔控制点方向跟随出入侧：左出 → 控制点向左（x1-c），右出 → 向右（x1+c）；入侧同理反向
function bezierDSide(x1,y1,x2,y2,out,into){
  const c = Math.max(80, Math.abs(x2-x1)*.45);
  const c1 = out === "left" ? x1-c : x1+c;
  const c2 = into === "left" ? x2-c : x2+c;
  return `M${x1} ${y1} C${c1} ${y1},${c2} ${y2},${x2} ${y2}`;
}
// relationD 改为：const sides = pickPortSides(from, to);
//   const a = fieldPointSide(from, rel.fromField, sides.out);
//   const b = fieldPointSide(to, rel.toField, sides.into);
//   return bezierDSide(a.x, a.y, b.x, b.y, sides.out, sides.into);
// 橡皮筋预览同口径；拖表后重算自动换侧。
</script>
