# Delta — diagrams.yaml（diagram-api-auth）

> 模块：core | 提案：diagram-api-auth
> 目标：diagrams 全端点接入 Bearer JWT（auth_v1 体系），新增 share_token 匿名读豁免与分享令牌铸造端点；`COLDRAWDB_DIAGRAMS_AUTH` 开关控制（默认 off = 现状匿名）。

## MODIFIED — info

```yaml
openapi: 3.0.3
info:
  title: coldrawdb diagrams v1 API
  version: 1.2.0
  description: |
    与 backend/src/diagrams_v1.rs 和 diagram_persistence.rs 的实际实现对齐。
    五个 /api/v1/diagrams* 端点统一使用 {code,data,request_id} envelope。

    diagram-api-auth：本组端点支持 Bearer JWT 强制鉴权（auth_v1 签发的 access_token），
    由环境变量 COLDRAWDB_DIAGRAMS_AUTH 控制：
    - off（默认）：现状匿名直通，与 v1.1.0 行为一致（前端登录接线完成前的过渡态）。
    - on：除下列豁免外，全部端点要求 Authorization: Bearer <access_token>，缺失/非法返回 401。
    唯一匿名豁免：GET /diagrams/{id} 携带有效 ?share_token=（见该端点说明）。
    本版本不做图级所有权授权：任何登录用户可读写任意 diagram（细粒度授权另案）。
servers:
  - url: http://localhost:3000
```

