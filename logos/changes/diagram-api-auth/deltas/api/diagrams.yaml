## ADDED — paths./api/v1/diagrams/{id}/share

```yaml
  /api/v1/diagrams/{id}/share:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: shareDiagram
      summary: 铸造/轮换分享令牌（diagram-api-auth 新增）
      description: |
        生成该图的 share_token（重复调用即轮换，旧分享链接立即失效）。
        COLDRAWDB_DIAGRAMS_AUTH=on 时要求 Bearer token（401）；
        flag=off 时匿名可调（与全组端点过渡策略一致）。
        软删除（is_deleted=1）的图返回 404。
      responses:
        '200':
          description: 铸造/轮换成功，返回新 share_token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, share_token]
                        properties:
                          id:
                            type: string
                          share_token:
                            type: string
                            description: "随机 URL-safe 令牌；匿名读图时作为 ?share_token= 查询参数"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
```

