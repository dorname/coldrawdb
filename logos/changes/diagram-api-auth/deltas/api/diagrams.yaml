## MODIFIED — paths./api/v1/diagrams/{id}.get

```yaml
  /api/v1/diagrams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 当前实现使用雪花字符串 ID，不保证 UUID
      - name: share_token
        in: query
        required: false
        schema:
          type: string
        description: "分享令牌（diagram.share_token）。diagram-api-auth：匿名读的唯一豁免凭证；携带且匹配时无需登录即可读图（S02 分享加载）。"
    get:
      operationId: getDiagram
      summary: 获取完整 diagram
      description: |
        S01/S02：从关系存储加载 diagram。
        fix-collab-autosave-race：若 diagram 绑定活跃 room 且协作文档已物化
        （room_collab_head.doc_json 非 NULL），直接返回物化文档
        （与 op log 恒一致；revision 字段注入当前 head server_rev）。

        diagram-api-auth（COLDRAWDB_DIAGRAMS_AUTH=on 时）：
        - 有效 Bearer token → 200（无图级所有权约束，任何登录用户可读）；
        - 无 token 但 share_token 匹配该图 → 200（匿名分享读，S02 场景）；
        - 无 token 且无 share_token → 401；
        - share_token 不匹配或该图未开分享 → 404（不暴露图存在性）。
        flag=off 时以上校验全部跳过，行为同 v1.1.0。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Diagram'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
```

## MODIFIED — paths./api/v1/diagrams/{id}.put.responses

```yaml
    put:
      operationId: saveDiagram
      summary: 使用 revision 乐观锁全量保存
      description: |
        S01：expected_revision 乐观锁全量保存（非房间 diagram 行为不变）。
        fix-collab-autosave-race：diagram 绑定活跃 room 时拒绝全量写——
        409 USE_OP_CHANNEL（房间内写只走 WS op 通道，op 落库即物化）。
        原 S05.5 checkpoint 头（X-Room-Id / X-Collab-Server-Rev）协议废弃。

        diagram-api-auth：COLDRAWDB_DIAGRAMS_AUTH=on 时要求 Bearer token，缺失/非法 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: 保存成功，revision 自增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: revision 冲突（details.current_revision 为服务端当前版本）| USE_OP_CHANNEL（room 绑定 diagram，写只走 WS op 通道）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
```

