# Delta — bridge.yaml（diagram-api-auth）

> 模块：core | 提案：diagram-api-auth
> 目标：bridge 6 路径 7 操作全部接入 Bearer JWT（`COLDRAWDB_DIAGRAMS_AUTH=on` 时），与 diagrams 同策略；`off` 时维持现状匿名。

## MODIFIED — info

```yaml
openapi: 3.0.3
info:
  title: coldrawdb bridge API
  description: |
    V1 bridge API for local draft import, import log management, and bridge runtime configuration.

    **Coverage**: 5 endpoints under `/api/v1/bridge/*`（config 含 get/put 共 7 个操作）.
    **Alignment**: 与 `backend/src/phase3_bridge.rs` 5 个路由 handler 一一对应.
    **Storage**: `local_draft_import_log` 表存导入日志；`bridge_config` 表单例行配置.
    **Envelope**: 成功响应统一为 `{ code: 0, data: T, request_id: string }`；错误为 `{ code, message, request_id, details? }`.

    diagram-api-auth：本组全部端点支持 Bearer JWT 强制鉴权（auth_v1 access_token），
    由 `COLDRAWDB_DIAGRAMS_AUTH` 控制：off（默认）= 现状匿名直通；
    on = 全部端点缺失/非法 token 返回 401（`#/components/responses/Unauthorized`），无匿名豁免。
  version: 1.1.0
servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://staging.coldrawdb.example.com
    description: Staging
```

