openapi: 3.0.3
info:
  title: coldrawdb auth API
  description: |
    V2 用户鉴权 API（S03：注册 / 登录 / Token 续期 / 退出）。

    **Coverage**: 5 endpoints under `/api/v1/auth/*`.
    **来源时序图**: `core-S03-user-auth.md` §3–§6.
    **认证**: access_token 为 JWT Bearer（15m TTL）；refresh_token 为 HttpOnly Cookie。
    **对齐**: 与 `core-S03-user-auth-design.md` 交互规格一致。
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://staging.coldrawdb.example.com
    description: Staging

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: |
        S03.1 — `core-S03-user-auth.md` Step 3–16.
        Creates user with Argon2id password hash. Returns 409 if email exists.
      operationId: registerUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: EMAIL_EXISTS
                message: 该邮箱已注册
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      summary: Login with email and password
      description: |
        S03.2 — `core-S03-user-auth.md` Step 3–20.
        Returns JWT access_token in body and refresh_token in Set-Cookie (HttpOnly, Secure, SameSite=Lax).
      operationId: loginUser
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: refresh_token HttpOnly cookie
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials (uniform message, anti-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_CREDENTIALS
                message: 邮箱或密码错误
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using refresh cookie
      description: |
        S03.3 — `core-S03-user-auth.md` Step 6–17.
        Requires `refresh_token` cookie. May rotate refresh token.
      operationId: refreshToken
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: New access token issued
          headers:
            Set-Cookie:
              description: Rotated refresh_token when enabled
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token invalid or revoked
          headers:
            Set-Cookie:
              description: Clears refresh_token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: REFRESH_INVALID
                message: 登录已过期，请重新登录
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token and end session
      description: |
        S03.4 — `core-S03-user-auth.md` Step 3–10.
        Revokes refresh token server-side and clears cookie.
      operationId: logoutUser
      tags: [auth]
      security:
        - bearerAuth: []
        - refreshCookie: []
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              description: Clears refresh_token
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user
      description: Session probe for AppBar user-menu. S03 auxiliary endpoint.
      operationId: getCurrentUser
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: token_expired
                message: Access token expired

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (default TTL 15m)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token for /auth/refresh and /auth/logout

  parameters:
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: 服务器内部错误

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Must contain letter and digit
        displayName:
          type: string
          maxLength: 32
          nullable: true

    RegisterResponse:
      type: object
      required: [userId, email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, verify_pending]
          default: active

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rememberDevice:
          type: boolean
          default: false
          description: Extends refresh token TTL when true

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: integer
          description: Access token TTL in seconds
          example: 900
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer

    RefreshResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          enum: [Bearer]

    UserProfile:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - EMAIL_EXISTS
            - INVALID_CREDENTIALS
            - REFRESH_INVALID
            - token_expired
            - INTERNAL_ERROR
            - UNAUTHORIZED
        message:
          type: string

    ValidationErrorResponse:
      type: object
      required: [code, message, fields]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR]
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    RateLimitError:
      type: object
      required: [code, message, retryAfter]
      properties:
        code:
          type: string
          enum: [TOO_MANY_ATTEMPTS]
        message:
          type: string
        retryAfter:
          type: integer
          description: Seconds until retry allowed
