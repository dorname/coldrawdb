schema_version: "1.0"
proposal: align-unified-prototype-and-add-mcp
scenario: S06
protocol:
# mcp-canvas-tools（2026-09-18）：新增 update_table / update_field / update_reference / layout_diagram 共 4 个画布编辑 tool。
# fix-remote-github-issues-7-18（2026-09-18）：update_reference 新增 color 参数（#12）；
# 写工具（update_diagram/update_table/update_field/update_reference/layout_diagram/update_dictionary）成功响应约定：
# 必须 normalize 为与各自 outputSchema 完全一致的瘦响应（update_* 恰好 { id, revision }，
# update_dictionary 另含 { dict_id, fields_cleared }；
# layout_diagram 恰好 { id, revision, tables_repositioned }），不透传上游 envelope 或整图字段（#18）。
# fix-open-issues-26-33（2026-09-27，#26）：update_diagram 新增载荷软上限
# （COLDRAWDB_MCP_PAYLOAD_SOFT_LIMIT_BYTES，默认 256 KiB）：超限本地拦截返回
# PAYLOAD_TOO_LARGE（details 含 payload_bytes / soft_limit_bytes / suggestion / batch_hint），
# 不发送上游请求；大图官方分批路径 = update_table / update_field / update_reference / layout_diagram
# 串行 expected_revision（见 core-S06-mcp-service-design.md §4.4）。
# mcp-dictionary-tools（2026-09-28）：新增 update_dictionary 工具（create/update/delete），
# update_field 新增 dict_code 参数（数据字典绑定，S07 软引用按编码）。
# 现有 tools 总数：12 个（11 个既有 + 1 个新增）。
# fix-issues-42-44-mcp-and-relation-hit（2026-09-28，#42）：import_schema 描述明确「仅新建不覆盖」；
# update_diagram 错误可诊断（details 含 http_status/content_type/body_excerpt）+
# 409 非 JSON 含 USE_OP_CHANNEL 字样鲁棒识别（core-S06 §4.5）。
  name: Model Context Protocol
  transport: stdio
  version_strategy: negotiate
server:
  name: coldrawdb-mcp
  title: coldrawdb MCP
  instructions: >-
    仅操作 COLDRAWDB_BASE_URL 指向的 coldrawdb。修改前先读取最新 revision；
    delete_diagram 具有破坏性并需用户批准；禁止把本服务用于任意 SQL、文件或 HTTP 访问。
    diagram-api-auth：当后端开启 COLDRAWDB_DIAGRAMS_AUTH=on 时，全部 12 个工具
    均要求 COLDRAWDB_ACCESS_TOKEN（auth_v1 /auth/login 签发的 access_token，Bearer 注入）；
    token 缺失或过期时所有工具调用将收到上游 401（映射为 UNAUTHENTICATED）。
    flag=off（默认过渡态）时 token 仅 rooms/collab 写工具需要。
configuration:
  COLDRAWDB_BASE_URL:
    required: true
    type: string
    format: uri
    allowed_schemes: [http, https]
  COLDRAWDB_ACCESS_TOKEN:
    required: false
    type: string
    secret: true
  COLDRAWDB_REQUEST_TIMEOUT_SECS:
    required: false
    type: integer
    minimum: 1
    maximum: 120
    default: 30
  COLDRAWDB_MCP_PAYLOAD_SOFT_LIMIT_BYTES:
    required: false
    type: integer
    minimum: 16384
    default: 262144
    description: "update_diagram 单次参数体积软上限（字节）；超限返回 PAYLOAD_TOO_LARGE 并建议分批"

tools:
  - name: list_diagrams
    title: 列出图表
    description: 返回 coldrawdb 中最近的图表摘要，默认最多 100 条。
    upstream:
      method: GET
      path: /diagrams/queryAll
      compatibility: legacy
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        query:
          type: string
          maxLength: 64
          description: adapter 侧按名称大小写不敏感过滤
    outputSchema:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/schemas/DiagramSummary"
        count:
          type: integer
          minimum: 0

  - name: get_diagram
    title: 获取图表
    description: 按 id 获取完整 diagram 和 revision。
    upstream:
      method: GET
      path: /api/v1/diagrams/{id}
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      $ref: "#/schemas/DiagramIdInput"
    outputSchema:
      $ref: "#/schemas/DiagramResult"

  - name: create_diagram
    title: 创建图表
    description: 创建空 diagram；复杂初始 schema 应使用 import_schema。
    upstream:
      method: POST
      path: /api/v1/diagrams
      request_shape: '{"name": string, "database"?: string}'
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        database:
          type: string
          minLength: 1
          maxLength: 64
    outputSchema:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1

  - name: update_diagram
    title: 更新图表
    description: >-
      使用 expected_revision 全量保存 diagram；409 时不自动覆盖。
      单次参数体积软上限 256 KiB（COLDRAWDB_MCP_PAYLOAD_SOFT_LIMIT_BYTES 可调，
      fix-open-issues-26-33 / #26）：超限返回 PAYLOAD_TOO_LARGE 且不发送请求，
      details 给出当前体积与分片建议。大图（数十表/关系或含批量布局颜色变更）
      请分批写入：按表用 update_table、按字段用 update_field、按关系用
      update_reference、布局用 layout_diagram，每批携带最新 expected_revision
      严格串行（并行分批必然 409）。
    upstream:
      method: PUT
      path: /api/v1/diagrams/{id}
      request_shape: '{"expected_revision": integer, "diagram": object}'
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, expected_revision, diagram]
      properties:
        id:
          type: string
          minLength: 1
        expected_revision:
          type: integer
          minimum: 0
        diagram:
          $ref: "#/schemas/Diagram"
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1

  - name: delete_diagram
    title: 删除图表
    description: 软删除 diagram；客户端必须先获得用户批准，参数 confirm 还必须为 true。
    upstream:
      method: DELETE
      path: /api/v1/diagrams/{id}
      current_behavior: 当前后端对不存在 id 也返回成功，adapter 不虚构 NOT_FOUND
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, confirm]
      properties:
        id:
          type: string
          minLength: 1
        confirm:
          const: true
    outputSchema:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          const: true

  - name: import_schema
    title: 导入 Schema
    description: 将 drawdb JSON object 导入为新 diagram。仅新建，不覆盖已有 id；更新已有图表请用 update_diagram / update_table 等增量工具（#42 R-MCPERR-04）。
    upstream:
      method: POST
      path: /api/v1/diagrams/import
      request_shape: '{"source"?: string, "payload": object}'
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [format, payload]
      properties:
        format:
          const: drawdb_json
        source:
          type: string
          maxLength: 64
          default: mcp
        payload:
          type: object
    outputSchema:
      type: object
      required: [diagram_id, imported_tables, imported_fields, warnings]
      properties:
        diagram_id:
          type: string
        imported_tables:
          type: integer
          minimum: 0
        imported_fields:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string

  - name: export_schema
    title: 导出 Schema
    description: 读取完整 diagram，并在本地确定性导出 JSON、DBML 或 SQL。
    upstream:
      method: GET
      path: /api/v1/diagrams/{id}
      post_process: pure_serializer
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, format]
      properties:
        id:
          type: string
          minLength: 1
        format:
          enum: [json, dbml, mysql, postgresql, sqlite, mariadb, mssql, oracle, generic]
    outputSchema:
      type: object
      required: [diagram_id, revision, format, mime_type, content]
      properties:
        diagram_id:
          type: string
        revision:
          type: integer
          minimum: 0
        format:
          type: string
        mime_type:
          type: string
        content:
          type: string

  - name: update_table
    title: 更新表属性
    description: 修改指定表的名称、注释、位置、颜色或锁定状态。通过 GET 全量读取 + PUT 全量写回实现。本工具是大图分批写入的官方分片手段之一（按表），详见 update_diagram 的分批指引。
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, table_id]
      properties:
        id:
          type: string
          minLength: 1
        table_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
        comment:
          type: string
          maxLength: 256
        x:
          type: number
        y:
          type: number
        color:
          type: string
          maxLength: 32
        locked:
          type: boolean
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1

  - name: update_field
    title: 更新字段属性
    description: 修改指定表中指定字段的名称、注释、类型、约束或数据字典绑定。通过 GET 全量读取 + PUT 全量写回实现。本工具是大图分批写入的官方分片手段之一（按字段），详见 update_diagram 的分批指引。dict_code 为 S07 数据字典软引用（按编码）：传空串解除绑定；传非空编码时本地校验目标字典存在，不存在返回 VALIDATION_ERROR 且不发 HTTP。
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, table_id, field_id]
      properties:
        id:
          type: string
          minLength: 1
        table_id:
          type: string
          minLength: 1
        field_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
        comment:
          type: string
          maxLength: 256
        type:
          type: string
          maxLength: 64
        not_null:
          type: boolean
        primary:
          type: boolean
        default:
          type: string
          maxLength: 256
        dict_code:
          type: string
          maxLength: 64
          description: "数据字典编码（S07 软引用）；空串 = 解除绑定；非空时字典必须已存在"
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1

  - name: update_reference
    title: 更新关系连线
    description: "创建、更新或删除字段间的关系连线（含基数、级联约束与连线颜色 color）。通过 GET 全量读取 + PUT 全量写回实现。成功响应为 outputSchema 瘦响应 { id, revision }。本工具是大图分批写入的官方分片手段之一（按关系），详见 update_diagram 的分批指引。"
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id:
          type: string
          minLength: 1
        action:
          enum: [create, update, delete]
        ref_id:
          type: string
          minLength: 1
        start_table_id:
          type: string
          minLength: 1
        start_field_id:
          type: string
          minLength: 1
        end_table_id:
          type: string
          minLength: 1
        end_field_id:
          type: string
          minLength: 1
        cardinality:
          enum: [one_to_one, one_to_many, many_to_one, many_to_many]
        on_delete:
          enum: [cascade, set_null, set_default, restrict, no_action]
        on_update:
          enum: [cascade, set_null, set_default, restrict, no_action]
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 64
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1

  - name: layout_diagram
    title: 自动布局
    description: "对指定 diagram 执行力导向自动布局（Fruchterman-Reingold 变体），按 reference 关联聚类排列表位置。通过 GET 全量读取 + PUT 全量写回实现。成功响应为 outputSchema 瘦响应 { id, revision, tables_repositioned }。本工具承接分批写入中的布局写回，详见 update_diagram 的分批指引。"
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: force_directed_layout
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
        mode:
          enum: [force]
          default: force
        iterations:
          type: integer
          minimum: 10
          maximum: 500
          default: 100
        spacing:
          type: number
          minimum: 50
          maximum: 500
          default: 180
    outputSchema:
      type: object
      required: [id, revision, tables_repositioned]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        tables_repositioned:
          type: integer
          minimum: 0
  - name: update_dictionary
    title: 管理数据字典
    description: >-
      创建、更新或删除 S07 数据字典（dictionaries 快照数组）。
      通过 GET 全量读取 + PUT 全量写回实现（携带最新 revision 乐观锁）。
      create：追加字典（id 由调用方给定，code 本地校验唯一，冲突返回
      VALIDATION_ERROR 且不发 HTTP，对齐 S07 EX-7.1）。
      update：按 dict_id 就地改写 name/code/comment/items（items 整体替换）；
      改 code 时校验唯一性，并同步改写所有引用字段的 dict_code，避免悬空绑定。
      delete：按 dict_id 删除字典，级联将 dict_code 指向该字典编码的全部字段
      置空（对齐 S07 §5 级联置空语义），返回 fields_cleared 受影响字段数。
    upstream:
      method: GET + PUT
      path: /api/v1/diagrams/{id}
      post_process: partial_update
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id:
          type: string
          minLength: 1
          description: "diagram ID"
        action:
          type: string
          enum: [create, update, delete]
        dict_id:
          type: string
          minLength: 1
          maxLength: 64
          description: "create：新字典 id（缺省由服务生成 dict- 前缀）；update/delete：目标字典 id（必填）"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: "字典名称（create 必填；update 可选）"
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: "字典编码（create 必填；update 可选，图内唯一）"
        comment:
          type: string
          maxLength: 256
        items:
          type: array
          maxItems: 500
          description: "字典项整体替换（create/update）；每项 {id?, value, label, sort?}，id 缺省自动生成"
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              id:
                type: string
                maxLength: 64
              value:
                type: string
                minLength: 1
                maxLength: 64
              label:
                type: string
                minLength: 1
                maxLength: 128
              sort:
                type: integer
                minimum: 0
    outputSchema:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        dict_id:
          type: string
          description: "本次操作的字典 id"
        fields_cleared:
          type: integer
          minimum: 0
          description: "delete 时被级联置空的字段数（其他 action 恒为 0）"


schemas:
  DiagramIdInput:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
  DiagramSummary:
    type: object
    required: [id, name]
    properties:
      id:
        type: string
      name:
        type: string
      database:
        type: [string, "null"]
      revision:
        type: integer
        minimum: 0
      updated_at:
        type: [string, "null"]
  DiagramResult:
    type: object
    required: [diagram]
    properties:
      diagram:
        $ref: "#/schemas/Diagram"
  Diagram:
    type: object
    required: [id, name]
    additionalProperties: true
    properties:
      id:
        type: string
      # fix-diagram-import-persistence（UT-MCP-29）：修复前导入的存量图 name 可能为
      # null；值放宽可空、键保留 required，杜绝客户端 schema 硬校验失败。
      name:
        type: [string, "null"]
      database:
        type: [string, "null"]
      revision:
        type: integer
        minimum: 0
      tables:
        type: array
        items:
          type: object
      references:
        type: array
        items:
          type: object
      areas:
        type: array
        items:
          type: object
      notes:
        type: array
        items:
          type: object
  UpdateTableInput:
    type: object
    required: [id, table_id]
    properties:
      id:
        type: string
        minLength: 1
      table_id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
        maxLength: 64
      comment:
        type: string
        maxLength: 256
      x:
        type: number
      y:
        type: number
      color:
        type: string
        maxLength: 32
      locked:
        type: boolean

  UpdateFieldInput:
    type: object
    required: [id, table_id, field_id]
    properties:
      id:
        type: string
        minLength: 1
      table_id:
        type: string
        minLength: 1
      field_id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
        maxLength: 64
      comment:
        type: string
        maxLength: 256
      type:
        type: string
        maxLength: 64
      not_null:
        type: boolean
      primary:
        type: boolean
      default:
        type: string
        maxLength: 256

  UpdateReferenceInput:
    type: object
    required: [id, action]
    properties:
      id:
        type: string
        minLength: 1
      action:
        enum: [create, update, delete]
      ref_id:
        type: string
        minLength: 1
      start_table_id:
        type: string
        minLength: 1
      start_field_id:
        type: string
        minLength: 1
      end_table_id:
        type: string
        minLength: 1
      end_field_id:
        type: string
        minLength: 1
      cardinality:
        enum: [one_to_one, one_to_many, many_to_one, many_to_many]
      on_delete:
        enum: [cascade, set_null, set_default, restrict, no_action]
      on_update:
        enum: [cascade, set_null, set_default, restrict, no_action]
      name:
        type: string
        maxLength: 64

  LayoutDiagramInput:
    type: object
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
      mode:
        enum: [force]
        default: force
      iterations:
        type: integer
        minimum: 10
        maximum: 500
        default: 100
      spacing:
        type: number
        minimum: 50
        maximum: 500
        default: 180

  ToolError:
    type: object
    required: [code, message, retryable]
    properties:
      code:
        enum:
          - CONFIG_INVALID
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - PERMISSION_DENIED
          - NOT_FOUND
          - REVISION_CONFLICT
          - UPSTREAM_TIMEOUT
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_ERROR
          - INTERNAL_ERROR
      message:
        type: string
      retryable:
        type: boolean
      request_id:
        type: string
      details:
        type: object
        additionalProperties: true

# mcp-dictionary-tools（2026-09-28）：update_dictionary / update_field(dict_code) 复用既有错误码——
# 参数与编码唯一性/存在性校验失败走 local_validation（VALIDATION_ERROR，retryable=false，本地拒绝不发 HTTP）；无新增错误码。
error_mapping:
  local_validation: VALIDATION_ERROR
  local_payload_oversize: PAYLOAD_TOO_LARGE
  network_connect: UPSTREAM_UNAVAILABLE
  network_timeout: UPSTREAM_TIMEOUT
  http_400: VALIDATION_ERROR
  http_401: UNAUTHENTICATED
  http_403: PERMISSION_DENIED
  http_404: NOT_FOUND
  http_409: REVISION_CONFLICT
  http_422: VALIDATION_ERROR
  http_5xx: UPSTREAM_ERROR

security_invariants:
  - 不直接访问 SQLite 或 SeaORM
  - 不提供任意 SQL、shell、文件或通用 HTTP 工具
  - stdout 仅写 MCP 帧，日志仅写 stderr
  - Authorization、Cookie、Token 在日志和 reporter 中必须脱敏
  - 写工具不自动重试，409 不自动覆盖

