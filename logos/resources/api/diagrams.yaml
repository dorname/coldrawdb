openapi: 3.0.3
info:
  title: coldrawdb diagrams v1 API
  version: 1.2.0
  description: |
    与 backend/src/diagrams_v1.rs 和 diagram_persistence.rs 的实际实现对齐。
    五个 /api/v1/diagrams* 端点统一使用 {code,data,request_id} envelope。

    diagram-api-auth：本组端点支持 Bearer JWT 强制鉴权（auth_v1 签发的 access_token），
    由环境变量 COLDRAWDB_DIAGRAMS_AUTH 控制：
    - off（默认）：现状匿名直通，与 v1.1.0 行为一致（前端登录接线完成前的过渡态）。
    - on：除下列豁免外，全部端点要求 Authorization: Bearer <access_token>，缺失/非法返回 401。
    唯一匿名豁免：GET /diagrams/{id} 携带有效 ?share_token=（见该端点说明）。
    本版本不做图级所有权授权：任何登录用户可读写任意 diagram（细粒度授权另案）。
servers:
  - url: http://localhost:3000
paths:
  /api/v1/diagrams:
    post:
      operationId: createDiagram
      summary: 创建空 diagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: 创建成功；实际实现不是 201，且只返回 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/diagrams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 当前实现使用雪花字符串 ID，不保证 UUID
      - name: share_token
        in: query
        required: false
        schema:
          type: string
        description: "分享令牌（diagram.share_token）。diagram-api-auth：匿名读的唯一豁免凭证；携带且匹配时无需登录即可读图（S02 分享加载）。"
    get:
      operationId: getDiagram
      summary: 获取完整 diagram
      description: |
        S01/S02：从关系存储加载 diagram。
        fix-collab-autosave-race：若 diagram 绑定活跃 room 且协作文档已物化
        （room_collab_head.doc_json 非 NULL），直接返回物化文档
        （与 op log 恒一致；revision 字段注入当前 head server_rev）。

        diagram-api-auth（COLDRAWDB_DIAGRAMS_AUTH=on 时）：
        - 有效 Bearer token → 200（无图级所有权约束，任何登录用户可读）；
        - 无 token 但 share_token 匹配该图 → 200（匿名分享读，S02 场景）；
        - 无 token 且无 share_token → 401；
        - share_token 不匹配或该图未开分享 → 404（不暴露图存在性）。
        flag=off 时以上校验全部跳过，行为同 v1.1.0。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Diagram'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
    put:
      operationId: saveDiagram
      summary: 使用 revision 乐观锁全量保存
      description: |
        S01：expected_revision 乐观锁全量保存（非房间 diagram 行为不变）。
        fix-collab-autosave-race：diagram 绑定活跃 room 时拒绝全量写——
        409 USE_OP_CHANNEL（房间内写只走 WS op 通道，op 落库即物化）。
        原 S05.5 checkpoint 头（X-Room-Id / X-Collab-Server-Rev）协议废弃。

        diagram-api-auth：COLDRAWDB_DIAGRAMS_AUTH=on 时要求 Bearer token，缺失/非法 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '200':
          description: 保存成功，revision 自增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: revision 冲突（details.current_revision 为服务端当前版本）| USE_OP_CHANNEL（room 绑定 diagram，写只走 WS op 通道）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteDiagram
      summary: 软删除 diagram
      description: 当前实现执行 is_deleted=1；不存在的 id 也返回 200，后续若修正必须同步更新契约与测试。diagram-api-auth：COLDRAWDB_DIAGRAMS_AUTH=on 时要求 Bearer token，缺失/非法 401。
      responses:
        '200':
          description: 返回提交的 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/diagrams/import:
    post:
      operationId: importDiagram
      summary: "导入 drawdb JSON object（缺 id 表/字段自动补全，坏表跳过并记入 warnings）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: "导入成功；imported_tables/imported_fields 按实际持久化数量上报"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: "持久化失败（不创建半成品图，已插入的空图行回收）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/diagrams/{id}/share:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: shareDiagram
      summary: 铸造/轮换分享令牌（diagram-api-auth 新增）
      description: |
        生成该图的 share_token（重复调用即轮换，旧分享链接立即失效）。
        COLDRAWDB_DIAGRAMS_AUTH=on 时要求 Bearer token（401）；
        flag=off 时匿名可调（与全组端点过渡策略一致）。
        软删除（is_deleted=1）的图返回 404。
      responses:
        '200':
          description: 铸造/轮换成功，返回新 share_token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, share_token]
                        properties:
                          id:
                            type: string
                          share_token:
                            type: string
                            description: "随机 URL-safe 令牌；匿名读图时作为 ?share_token= 查询参数"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
components:
  responses:
    Unauthorized:
      description: "未授权：COLDRAWDB_DIAGRAMS_AUTH=on 且缺少/非法 Authorization: Bearer（auth_v1 access_token）"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApiError:
      description: API 错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiResponse:
      type: object
      required: [code, data, request_id]
      properties:
        code:
          type: integer
          enum: [0]
        data: {}
        request_id:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
    CreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        database:
          type: string
          nullable: true
    CreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: string
    SaveRequest:
      type: object
      required: [expected_revision, diagram]
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        diagram:
          $ref: '#/components/schemas/Diagram'
    SaveResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [id, revision]
              properties:
                id:
                  type: string
                revision:
                  type: integer
                  format: int64
    DeleteResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: string
    ImportRequest:
      type: object
      required: [payload]
      additionalProperties: false
      properties:
        source:
          type: string
          nullable: true
        payload:
          type: object
    ImportResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [diagram_id, imported_tables, imported_fields, warnings]
              properties:
                diagram_id:
                  type: string
                imported_tables:
                  type: integer
                  description: "实际持久化到库的表数量（fix-diagram-import-persistence：不再按 payload 原始数量虚报）"
                imported_fields:
                  type: integer
                  description: "实际持久化到库的字段数量"
                warnings:
                  type: array
                  items:
                    type: string
                  description: "丢弃的坏表/坏字段明细与自动补全说明（如 'table[2] dropped: missing name'、'generated id for table[0]'）"
                source:
                  type: string
                  nullable: true
    Diagram:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        database: { type: string, nullable: true }
        pan: { type: string, nullable: true }
        zoom: { type: string, nullable: true }
        revision: { type: integer, format: int64, default: 0 }
        tables:
          type: array
          items: { $ref: '#/components/schemas/Table' }
        references:
          type: array
          items: { $ref: '#/components/schemas/Reference' }
        areas:
          type: array
          items: { $ref: '#/components/schemas/Area' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
    Table:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        x: { type: number, format: double, default: 0 }
        y: { type: number, format: double, default: 0 }
        color: { type: string, default: '' }
        comment: { type: string, default: '' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/Field' }
    Field:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        type_: { type: string, default: '' }
        default: { type: string, default: '' }
        check: { type: string, default: '' }
        primary: { type: boolean, default: false }
        unique: { type: boolean, default: false }
        not_null: { type: boolean, default: false }
        increment: { type: boolean, default: false }
        comment: { type: string, default: '' }
    Reference:
      type: object
      required: [id, start_table_id, end_table_id, start_field_id, end_field_id]
      properties:
        id: { type: string }
        name: { type: string, default: '' }
        start_table_id: { type: string }
        end_table_id: { type: string }
        start_field_id: { type: string }
        end_field_id: { type: string }
        type_: { type: string, default: '' }
        on_delete: { type: string, default: '' }
        on_update: { type: string, default: '' }
        color:
          type: string
          default: ''
          description: "Relation stroke color. Empty = inherit start table color when set, else theme default."
        line_type:
          type: string
          default: bezier
          enum: [bezier, orthogonal, straight]
          description: "Path style for the relation edge. Bulk updates (apply line_type to all references of a diagram, fix-open-issues-26-33 / #28) are performed client-side as a single undoable command and persisted via the existing whole-diagram save (PUT /api/v1/diagrams/{id}); no dedicated batch endpoint exists."
        stroke_style:
          type: string
          default: solid
          enum: [solid, dashed]
          description: "Stroke dash pattern for the relation edge."
    Area:
      type: object
      required: [id]
      properties:
        id: { type: string }
        x: { type: number, default: 0 }
        y: { type: number, default: 0 }
        width: { type: number, default: 0 }
        height: { type: number, default: 0 }
        color: { type: string, default: '' }
        name: { type: string, default: '' }
    Note:
      type: object
      required: [id]
      properties:
        id: { type: string }
        x: { type: number, default: 0 }
        y: { type: number, default: 0 }
        content: { type: string, default: '' }
        color: { type: string, default: '' }
