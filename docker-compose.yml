# feat-docker-compose-deploy（core-01 部署方案 §5.1）：staging 形态 compose。
# 用法：docker compose up -d --build
services:
  coldrawdb:
    image: coldrawdb:v1
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      COLDRAWDB_DB_URL: "sqlite:///data/coldrawdb.db?mode=rwc"
      COLDRAWDB_LOG_LEVEL: "info"
      # fix-remote-github-issues / UT-S04-18：邀请链接公开基址 = SPA 入口（nginx:80），
      # 禁止默认裸后端 :3000。跨机部署时覆盖，如 PUBLIC_BASE_URL=http://192.168.20.106
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/diagrams/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      coldrawdb:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: alpine:3.19
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "
        apk add --no-cache sqlite tar &&
        while true; do
          tar czf /backups/coldrawdb-$$(date +%Y%m%d-%H%M%S).tar.gz -C /data .;
          sleep 86400;
        done
      "
    restart: unless-stopped
