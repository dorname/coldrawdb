openapi: 3.0.3
info:
  title: drawDB API
  version: 0.1.0-draft
  description: Phase 0 方案冻结阶段 OpenAPI 草案（仅覆盖 diagram 主链路）
servers:
  - url: http://localhost:8080
paths:
  /api/v1/diagrams:
    post:
      summary: 创建 diagram
      operationId: createDiagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagramRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDiagram'
  /api/v1/diagrams/{id}:
    get:
      summary: 获取 diagram 全量
      operationId: getDiagram
      parameters:
        - $ref: '#/components/parameters/DiagramId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDiagram'
        '404':
          description: 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: 保存 diagram（乐观锁）
      operationId: saveDiagram
      parameters:
        - $ref: '#/components/parameters/DiagramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDiagramRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDiagram'
        '409':
          description: revision 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
    delete:
      summary: 删除 diagram（软删除或硬删除）
      operationId: deleteDiagram
      parameters:
        - $ref: '#/components/parameters/DiagramId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/diagrams/import:
    post:
      summary: 导入旧版 JSON
      operationId: importDiagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDiagramRequest'
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseImportResult'

components:
  parameters:
    DiagramId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiMeta:
      type: object
      properties:
        request_id:
          type: string

    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true

    ConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            details:
              type: object
              properties:
                current_revision:
                  type: integer

    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object
          nullable: true
        request_id:
          type: string

    ApiResponseDiagram:
      type: object
      properties:
        code:
          type: integer
          example: 0
        data:
          $ref: '#/components/schemas/Diagram'
        request_id:
          type: string

    ApiResponseImportResult:
      type: object
      properties:
        code:
          type: integer
          example: 0
        data:
          $ref: '#/components/schemas/ImportResult'
        request_id:
          type: string

    CreateDiagramRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        database:
          type: string

    SaveDiagramRequest:
      type: object
      required: [expected_revision, diagram]
      properties:
        expected_revision:
          type: integer
          minimum: 0
        diagram:
          $ref: '#/components/schemas/Diagram'

    ImportDiagramRequest:
      type: object
      required: [payload]
      properties:
        source:
          type: string
          example: localStorage
        payload:
          type: object
          additionalProperties: true

    ImportResult:
      type: object
      properties:
        diagram_id:
          type: string
        imported_tables:
          type: integer
        imported_fields:
          type: integer
        warnings:
          type: array
          items:
            type: string

    Diagram:
      type: object
      required: [id, name, revision]
      properties:
        id:
          type: string
        name:
          type: string
        database:
          type: string
        pan:
          type: string
        zoom:
          type: string
        revision:
          type: integer
        updated_at:
          type: string
        is_deleted:
          type: boolean
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'

    Table:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        comment:
          type: string
        locked:
          type: boolean
        x:
          type: string
        y:
          type: string
        is_deleted:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        indices:
          type: array
          items:
            $ref: '#/components/schemas/Indice'

    Field:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        not_null:
          type: boolean
        primary:
          type: boolean
        unique:
          type: boolean
        increment:
          type: boolean
        default:
          type: string
        check:
          type: string
        size:
          type: integer
        is_deleted:
          type: boolean

    Indice:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        unique:
          type: boolean
        is_deleted:
          type: boolean
        field_ids:
          type: array
          items:
            type: string

    Reference:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        cardinality:
          type: string
        startTableId:
          type: string
        startFieldId:
          type: string
        endTableId:
          type: string
        endFieldId:
          type: string
        deleteConstraint:
          type: string
        updateConstraint:
          type: string
        is_deleted:
          type: boolean

    Note:
      type: object
      required: [id]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        color:
          type: string
        x:
          type: string
        y:
          type: string
        height:
          type: string
        is_deleted:
          type: boolean

    Area:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        x:
          type: string
        y:
          type: string
        width:
          type: string
        height:
          type: string
        is_deleted:
          type: boolean
